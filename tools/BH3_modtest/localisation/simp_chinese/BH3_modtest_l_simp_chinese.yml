l_simp_chinese:
 BH3_modtest_category:0 "BH3 伤害修正测试"
 BH3_test_immune:0 "测试：受伤 -100%"
 BH3_test_immune_desc:0 "str_damage_multiplier = -1.0 且 org_damage_multiplier = -1.0。如果生效，战斗中师不应损失兵力与组织度。"
 BH3_test_half:0 "测试：受伤 -50%"
 BH3_test_half_desc:0 "str_damage_multiplier = -0.5 且 org_damage_multiplier = -0.5。"
 BH3_test_str_only:0 "测试：兵力伤害 -100%"
 BH3_test_str_only_desc:0 "仅 str_damage_multiplier = -1.0，组织度伤害应仍然生效。"
 BH3_test_org_only:0 "测试：组织度伤害 -100%"
 BH3_test_org_only_desc:0 "仅 org_damage_multiplier = -1.0，兵力伤害应仍然生效。"
 BH3_test_double:0 "测试：受伤 +100%（对照）"
 BH3_test_double_desc:0 "str_damage_multiplier = 1.0 且 org_damage_multiplier = 1.0。对照用：若符号正确，师应被打得更惨。"
 BH3_test_add_immune:0 "添加：受伤 -100%"
 BH3_test_add_immune_desc:0 "点击添加 -100% 受伤的国家精神。"
 BH3_test_add_half:0 "添加：受伤 -50%"
 BH3_test_add_half_desc:0 "点击添加 -50% 受伤的国家精神。"
 BH3_test_add_str_only:0 "添加：仅兵力伤害 -100%"
 BH3_test_add_str_only_desc:0 "点击添加仅兵力减伤的精神。"
 BH3_test_add_org_only:0 "添加：仅组织度伤害 -100%"
 BH3_test_add_org_only_desc:0 "点击添加仅组织度减伤的精神。"
 BH3_test_add_double:0 "添加：受伤 +100%（对照）"
 BH3_test_add_double_desc:0 "点击添加 +100% 受伤的对照精神。"
 BH3_test_remove_all:0 "移除全部测试精神"
 BH3_test_remove_all_desc:0 "移除所有测试理念，便于做前后对照。"
 ABILITY_BH3_TEST_IMMUNE:0 "测试技能：受伤 -100%"
 ABILITY_BH3_TEST_IMMUNE_DESC:0 "指挥官技能。unit_modifiers：str_damage_multiplier = -1.0，org_damage_multiplier = -1.0，持续 168 小时。"
 ABILITY_BH3_TEST_HALF:0 "测试技能：受伤 -50%"
 ABILITY_BH3_TEST_HALF_DESC:0 "指挥官技能。两个倍率都 -0.5。"
 ABILITY_BH3_TEST_STR_ONLY:0 "测试技能：兵力伤害 -100%"
 ABILITY_BH3_TEST_STR_ONLY_DESC:0 "指挥官技能。仅 str_damage_multiplier = -1.0。"
 ABILITY_BH3_TEST_ORG_ONLY:0 "测试技能：组织度伤害 -100%"
 ABILITY_BH3_TEST_ORG_ONLY_DESC:0 "指挥官技能。仅 org_damage_multiplier = -1.0。"
 ABILITY_BH3_TEST_DOUBLE:0 "测试技能：受伤 +100%（对照）"
 ABILITY_BH3_TEST_DOUBLE_DESC:0 "指挥官技能对照组。两个倍率都 +1.0。"
 ABILITY_BH3_TEST_GATED:0 "测试技能：门槛 -80%（需持有精神）"
 ABILITY_BH3_TEST_GATED_DESC:0 "仅当国家持有 BH3_test_immune 时出现。时长 24 小时、冷却 168 小时、两个倍率 -0.8，用于验证门槛与冷却。"
 BH3_test_ud_army:0 "测试：额外伤害 - 敌国陆军 -5%"
 BH3_test_ud_army_desc:0 "以 mode 2、比例 5% 调用 BH3_UD_apply，观察敌方组织度/兵力下降。"
 BH3_test_ud_navy:0 "测试：额外伤害 - 敌国海军 -5%"
 BH3_test_ud_navy_desc:0 "以 mode 3、比例 5% 调用 BH3_UD_apply。"
 ABILITY_BH3_TEST_UD:0 "测试：额外伤害（指挥官技能）"
 ABILITY_BH3_TEST_UD_DESC:0 "在 one_time_effect 中调用 BH3_UD_apply（mode 2，5%）。"
 BH3_test_ud_literal_global:0 "测试：damage_units 字面量（不带 location）"
 BH3_test_ud_literal_global_desc:0 "直接 damage_units + limit has_war_with = ROOT，不指定州。对照 A。"
 BH3_test_ud_literal_every:0 "测试：damage_units 字面量（逐州）"
 BH3_test_ud_literal_every_desc:0 "every_enemy_country → every_owned_state → damage_units state = THIS。对照 B。"
 BH3_test_cd_source:0 "测试：30 天冷却的决议"
 BH3_test_cd_source_desc:0 "点一次后进入 30 天冷却。"
 BH3_test_cd_reset:0 "测试：重置该决议冷却"
 BH3_test_cd_reset_desc:0 "对上面决议调用 remove_decision_on_cooldown。"
 BH3_test_ability_cd_reset:0 "测试：尝试重置指挥官技能冷却"
 BH3_test_ability_cd_reset_desc:0 "用 remove_decision_on_cooldown 传技能 id（预期无效）。"
 ABILITY_BH3_TEST_IMMUNE_LONG:0 "测试：无敌（365 天）"
 ABILITY_BH3_TEST_IMMUNE_LONG_DESC:0 "受到伤害 -100%，持续 365 天。"
 ABILITY_BH3_TEST_HALF_LONG:0 "测试：半伤（365 天）"
 ABILITY_BH3_TEST_HALF_LONG_DESC:0 "受到伤害 -50%，持续 365 天。"
 ABILITY_BH3_TEST_DOUBLE_LONG:0 "测试：双倍伤害（365 天）"
 ABILITY_BH3_TEST_DOUBLE_LONG_DESC:0 "受到伤害 +100%，持续 365 天。"
 ABILITY_BH3_TEST_FLAG:0 "测试：技能旗标"
 ABILITY_BH3_TEST_FLAG_DESC:0 "实验A：通过 one_time_effect 给自己设置旗标 BH3_test_ability_flag_fired。"
 BH3_test_flag_check:0 "【测试】检测到技能旗标"
 BH3_test_flag_check_desc:0 "只有技能 one_time_effect 成功置旗标时才可见。"
 BH3_test_mark_enemies:0 "【测试】给所有敌国打上无敌标记"
 BH3_test_mark_enemies_desc:0 "给所有敌国设置 BH3_test_ability_flag_fired；之后对其发动核打击成功率应变为 0。"
 BH3_test_clear_marks:0 "【测试】清除无敌标记"
 BH3_test_clear_marks_desc:0 "清除自身与所有敌国的测试旗标。"
 BH3_test_flag_log:0 "【测试】旗标状态写入日志"
 BH3_test_flag_log_desc:0 "向 game.log 写入 BH3TEST self_flag/enemy_flag 行。"
 BH3_test_nuke_drop_check:0 "【测试】核爆钩子已触发"
 BH3_test_nuke_drop_check_desc:0 "只有 on_nuke_drop 触发时才可见（失败的空袭是否也触发，就是要测的点）。"
 BH3_test_paradrop_check:0 "【测试】伞降钩子已触发"
 BH3_test_paradrop_check_desc:0 "只有 on_paradrop 触发时才可见。"
 BH3_test_reset_hooks:0 "【测试】重置钩子旗标"
 BH3_test_reset_hooks_desc:0 "清除钩子测试记录的全局旗标。"
