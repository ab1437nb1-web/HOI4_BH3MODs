BH3_FlawlessKey_equipment:0 "Flawless Key"
BH3_FlawlessKey_equipment_desc:0 "The mysterious key of the Elysian Realm. In this mod: produced like equipment (250 IC); each Signet draw consumes 1."
BH3_FlawlessKey_equipment_0:0 "Flawless Key"
BH3_sp_ElysianRealm_Open:0 "Open the Elysian Realm"
BH3_sp_ElysianRealm_Open_desc:0 "Open the Elysian Realm: unlocks production of the Flawless Key and the Elysian Realm decision group, where keys are spent to draw Signets of the thirteen Flame-Chasers."
BH3_sp_tag_BH3_ElysianRealm:0 "Elysian Realm"
BH3_ElysianRealm_group:0 "Elysian Realm"
BH3_ElysianRealm_draw:0 "Enter the Realm: draw a Signet"
BH3_ElysianRealm_draw_desc:0 "Consume 1 Flawless Key to draw a Signet (Normal I/II/III -> Core -> Amplifier).\n§YState-based: all bonuses apply only while §RAT WAR§Y§!."
BH3_ElysianRealm_reset:0 "Reset Signets"
BH3_ElysianRealm_reset_desc:0 "Remove all Signets you hold (including their dynamic modifiers) and refund 3 Flawless Keys."
BH3_ER_Savior_1:0 "Deliverance I"
BH3_ER_Savior_1_desc:0 "First Normal Signet of §YKevin, the Deliverance§!.\n§RWhile at war§!: army attack +15%, breakthrough +18%, air attack +15%."
BH3_ER_Savior_2:0 "Deliverance II"
BH3_ER_Savior_2_desc:0 "Second Normal Signet.\n§RWhile at war§!: army attack +15%, breakthrough +18%, air attack +15%."
BH3_ER_Savior_3:0 "Deliverance III"
BH3_ER_Savior_3_desc:0 "Third Normal Signet.\n§RWhile at war§!: army attack +15%, breakthrough +18%, air attack +15%."
BH3_ER_Savior_Core:0 "Deliverance Core: Lone Shadow of the Deliverer"
BH3_ER_Savior_Core_desc:0 "Core Signet (mirrors the original: burst 50 hits, then Normal Signets become permanent).\n§RWhile at war§!: army attack +25%, breakthrough +30%, air attack +25%, army org +5."
BH3_ER_Savior_Amp:0 "Deliverance Amplifier: Lingering Dream of the Deliverer"
BH3_ER_Savior_Amp_desc:0 "Amplifier Signet (requires the Core; mirrors the original +50% to Normal Signets).\n§RWhile at war§!: army attack +35%, breakthrough +40%, air attack +35%, core-province attack +15%, planning speed +25%.\n§YFully upgraded§!: army attack +105%, breakthrough +124%, air attack +105% (benchmarked to a Divine Key's Zeroth Power)."
BH3_ElysianRealm.1.t:0 "Elysian Realm: Trial"
BH3_ElysianRealm.1.desc:0 "Echoes of memory gather deep within the Realm. Holding a Flawless Key, you may earn the acknowledgement of one of the Flame-Chasers - their Signet shall be carved upon your forces, awakening only §Rin war§!."
BH3_ElysianRealm.1.a:0 "Take 'Deliverance I' (in war: attack & breakthrough)"
BH3_ElysianRealm.1.b:0 "Take 'Deliverance II' (requires I)"
BH3_ElysianRealm.1.c:0 "Take 'Deliverance III' (requires II)"
BH3_ElysianRealm.1.d:0 "Take the Core Signet 'Lone Shadow of the Deliverer' (requires I-III)"
BH3_ElysianRealm.1.e:0 "Take the Amplifier Signet 'Lingering Dream of the Deliverer' (requires the Core)"
BH3_ElysianRealm.1.f:0 "Decline (gain 25 political power)"
