# ===== 往事乐土 P3 真我刻印 =====
BH3_ER_Elysia_GER:0 "True Self: Germania"
BH3_ER_Elysia_GER_desc:0 "Germany's custom Signet. Core mechanic 'Blitz Rhythm': every completed stage builds momentum - the higher it is, the stronger your offensive and production bonuses. Completing a stage before its historical date (Anschluss, March 1938 / Polish campaign, September 1939 / Barbarossa, June 1941) grants extra momentum. Delays are hard to recover from."
BH3_ER_Elysia_SOV:0 "True Self: Soviet"
BH3_ER_Elysia_SOV_desc:0 "The USSR's custom Signet. Core mechanic 'Depth': the more core territory you lose, the stronger your defence, attrition reduction and reinforcement; retaking land grants 'Liberation' bonuses."
BH3_ER_Elysia_GER_1a:0 "Rearmament: Four Year Plan"
BH3_ER_Elysia_GER_1a_desc:0 "Take the armament path: complete the Four Year Plan focus. Strong military industry, heavy consumer goods burden."
BH3_ER_Elysia_GER_1b:0 "Rearmament: Economic Recovery"
BH3_ER_Elysia_GER_1b_desc:0 "Cancel the MEFO system and pursue Prioritize Economic Growth. Lighter consumer goods, faster growth, slower armament."
BH3_ER_Elysia_GER_1c:0 "Rearmament: Lightning Expansion"
BH3_ER_Elysia_GER_1c_desc:0 "Ignore the economic paths and simply expand: reach 1,000,000 army manpower."
BH3_ER_Elysia_GER_2a:0 "Diplomacy: Munich Route"
BH3_ER_Elysia_GER_2a_desc:0 "Expand diplomatically: complete Demand the Sudetenland."
BH3_ER_Elysia_GER_2b:0 "Diplomacy: Showdown"
BH3_ER_Elysia_GER_2b_desc:0 "Go straight to war: force Poland to capitulate."
BH3_ER_Elysia_GER_3a:0 "East or West: Operation Sea Lion"
BH3_ER_Elysia_GER_3a_desc:0 "Invade and defeat the United Kingdom."
BH3_ER_Elysia_GER_3b:0 "East or West: Barbarossa"
BH3_ER_Elysia_GER_3b_desc:0 "Defeat the Soviet Union."
BH3_ER_Elysia_SOV_1a:0 "Return to Stability: End the Purges (Left)"
BH3_ER_Elysia_SOV_1a_desc:0 "End the Great Purge along the left path. Note: this focus chain has a hard floor of about 910 days (purge focuses, each gated by a 175-day mandatory interval)."
BH3_ER_Elysia_SOV_1b:0 "Return to Stability: End the Purges (Right)"
BH3_ER_Elysia_SOV_1b_desc:0 "End the Great Purge along the right path. Same 175-day intervals apply; hard floor about 910 days."
BH3_ER_Elysia_SOV_1c:0 "Return to Stability: Rebuild the Army"
BH3_ER_Elysia_SOV_1c_desc:0 "Skip the purge route and rebuild the officer corps instead: reach 1,500,000 army manpower."
BH3_ER_Elysia_SOV_2a:0 "Five Year Plan: Completion"
BH3_ER_Elysia_SOV_2a_desc:0 "Complete the Five Year Plan focus to lay the industrial base."
BH3_ER_Elysia_SOV_2b:0 "Five Year Plan: Move Industry East"
BH3_ER_Elysia_SOV_2b_desc:0 "Relocate industry beyond the Urals and prepare for the worst."
BH3_ER_Elysia_SOV_2c:0 "Five Year Plan: Fortified Belt"
BH3_ER_Elysia_SOV_2c_desc:0 "Improve the Stalin Line along the western border."
BH3_ER_Elysia_SOV_3a:0 "Hold the Line: Defend the Core"
BH3_ER_Elysia_SOV_3a_desc:0 "Be at war with Germany while keeping surrender progress below 30% - hold, do not collapse."
BH3_ER_Elysia_SOV_3b:0 "Hold the Line: Counterattack to Berlin"
BH3_ER_Elysia_SOV_3b_desc:0 "Push all the way: force Germany to capitulate."
