BH3_ER_gui_draw:0 "Enter the Trial: Signets, Choose 1 of 3 (50 Flawless Keys)"
BH3_ER_gui_draw_tt:0 "Spend §Y50 Flawless Keys§! for a draw faithful to the original game:\nThree §Yhero portals§! appear, each offering that hero's §Ynext Signet§! (Normal I->II->III -> Core -> Amplifier; the series advances automatically, matching the original's 'duplicates upgrade' rule).\n\nRules (as in the original):\n· Series without 3 Normal Signets -> next Normal Signet;\n· With 3 Normal Signets -> the series' §YCore Signet§!;\n· With the Core -> the series' §YAmplifier Signet§!;\n· The three candidates never repeat; if fewer remain, you may cancel for a full refund.\n\nClick a card to claim its Signet; hover a card for its full name and effects."
BH3_ER_gui_cancel:0 "Cancel (refund keys)"
BH3_ER_gui_cancel_tt:0 "Abandon the current three candidates and §Yrefund all 50 Flawless Keys§!."
BH3_ER_gui_reset:0 "Reset all Signets"
