BH3_doctrine_folder_valkyrie:0 "Valkyrie Combat Doctrine"
BH3_grand_doctrine_valkyrie:0 "Anti-Honkai Combat Theory"
BH3_grand_doctrine_valkyrie_desc:0 "A dual-purpose combat system centered on Valkyrie squads, aimed at both Honkai beasts and conventional warfare. Once unlocked, delve into seven doctrine tracks (Infantry / Combat Support / Armor / Operations / Close Assault / Herrscher Advent / Valkyrie Special Ops)."
BH3_doctrine_track_assault:0 "Close Assault"
BH3_doctrine_track_herrscher:0 "Herrscher Advent"
BH3_doctrine_track_special:0 "Valkyrie Special Ops"
BH3_doctrine_track_infantry:0 "Infantry Coordination"
BH3_doctrine_track_support:0 "Combat Support"
BH3_doctrine_track_armor:0 "Armored Assault"
BH3_doctrine_track_operations:0 "Deep Operations"
BH3_sd_bh3_sd_close_combat:0 "§YClose Quarters Annihilation Tactics§!"
BH3_sd_bh3_sd_close_combat_desc:0 "Integrates the old melee line trunk and its defensive branch: Annihilation→Rapid Engagement→Armed Recon→Dynamic Defense→Fire Brigade→Counteroffensive. Unlocks step by step with track mastery; full mastery equals the old line's complete form."
bh3_rwd_1_2:0 "Rapid Engagement"
bh3_rwd_1_3:0 "Armed Reconnaissance"
bh3_rwd_1_4_2:0 "Dynamic Defense"
bh3_rwd_1_5_2:0 "Fire Brigade Tactics"
bh3_rwd_1_6_2:0 "Counteroffensive Doctrine"
BH3_sd_bh3_sd_persistence:0 "§YSustained Offensive§!"
BH3_sd_bh3_sd_persistence_desc:0 "Integrates the old melee line's offensive branch: Sustained Offensive→Weakness Analysis→Heaven-Piercing Assault. The pinnacle of anti-armor output and grand assault."
bh3_rwd_1_5_1:0 "Weakness Analysis"
bh3_rwd_1_6_1:0 "Heaven-Piercing Assault"
BH3_sd_bh3_sd_rear_ops:0 "§YBehind Enemy Lines§!"
BH3_sd_bh3_sd_rear_ops_desc:0 "Integrates the old special-ops line's first half: Behind Enemy Lines→Combat Penetration→Airborne Assault→Specialized Training. The Valkyrie squads' special operations doctrine."
bh3_rwd_3_2:0 "Combat Penetration"
bh3_rwd_3_3:0 "Airborne Assault"
bh3_rwd_3_4:0 "Specialized Training"
BH3_sd_bh3_sd_ranged_suppression:0 "§YLong-Range Suppression Tactics§!"
BH3_sd_bh3_sd_ranged_suppression_desc:0 "Integrates the old support line: Suppression→Close Observation→Firepower Allocation→Barrage Coverage→Full-Spectrum Suppression. A support system built on firepower and air dominance."
bh3_rwd_2_2:0 "Close Observation"
bh3_rwd_2_3:0 "Firepower Allocation"
bh3_rwd_2_5_1:0 "Barrage Coverage"
bh3_rwd_2_6:0 "Full-Spectrum Suppression"
BH3_sd_bh3_sd_dispersed_support:0 "§YDispersed Support§!"
BH3_sd_bh3_sd_dispersed_support_desc:0 "Integrates the old support line's coordination branch and the special-ops line's finale: Dispersed Support→Coordinated Support→Combined Arms→Joint Operations. Mass-army coordination and deep operations."
bh3_rwd_2_4_2:0 "Coordinated Support"
bh3_rwd_2_5_2:0 "Combined Arms"
bh3_rwd_3_6:0 "Joint Operations"
BH3_sd_bh3_sd_herrscher_awaken:0 "§YHerrscher Awakening§!"
BH3_sd_bh3_sd_herrscher_awaken_desc:0 "The Herrscher's power descends upon the battlefield. At 100 track mastery, 'Herrscher Domination' is further unlocked."
bh3_rwd_herrscher_rule:0 "Herrscher Domination"
BH3_sd_bh3_sd_superior_numbers:0 "§YSuperior Numbers§!"
BH3_sd_bh3_sd_superior_numbers_desc:0 "Win through numbers and formation width: +1 brigade column, higher special forces cap. Mutually exclusive with 'Perfectionism'."
BH3_sd_bh3_sd_refined:0 "§YPerfectionism§!"
BH3_sd_bh3_sd_refined_desc:0 "Win through quality: all Valkyries gain attack and armor. Mutually exclusive with 'Superior Numbers'."