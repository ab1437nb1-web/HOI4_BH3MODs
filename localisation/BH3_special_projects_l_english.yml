BH3_sp_FenghuangDown:0 "§RThe Eighth Divine Keys:Fenghuang Down§!"
BH3_sp_FenghuangDown_desc:0 "A Divine Key forged from the core of the Eighth Herrscher of the Previous Era, known as the 'Key of Consciousness.' Its true form is unknown, and its appearance remains a mystery. It is only rumored to exist as 'feathers' in Shenzhou, as enigmatic as its abilities. However, its true power seems to be sealed…"
