BH3_sp_OathofJudah:0 "§RThe Eleventh Divine Keys:Oath of Judah§!"
BH3_sp_OathofJudah_desc:0 "A superweapon left behind by the civilization of the Previous Era, possessing the strongest 'sealing' power. When deployed, enemies near the cross will be immobilized, stripped of their ability to act, and have their Honkai energy completely nullified. Further research is needed to unlock its full potential."
