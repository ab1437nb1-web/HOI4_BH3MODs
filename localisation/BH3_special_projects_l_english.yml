BH3_sp_Void_Archives:0 "§RThe First Divine Keys:Void_Archives§!"
BH3_sp_Void_Archives_desc:0 "A weapon forged from the core of the First Herrscher of the Previous Era, the Herrscher of Reason. It can replicate weapons and tools whose construction principles the user understands, containing an almost infinitely expanding knowledge space. However, its true power seems to be sealed…"
