BH3_sp_StarofEden:0 "§RThe ninth Divine Keys:Star of Eden§!"
BH3_sp_StarofEden_desc:0 "A Divine Key forged from the core of the Ninth Herrscher of the Previous Era, possessing the power to manipulate gravity. It was first unearthed in the Yellowstone Ruins and later acquired by scientists from Schicksal's North American branch in the 20th century, becoming a key factor in the independence of the Anti-Entropy organization. Its usage has not yet been fully deciphered…"
