BH3_sp_ValkyrieArmor_Engine_HonkaiImproved:0 "Improved Honkai Reactor Drive"
BH3_sp_ValkyrieArmor_Engine_HonkaiImproved_desc:0 "Further optimization and upgrade of the Honkai reactor used for Valkyrie Armor drive to obtain greater output."
BH3_sp_ValkyrieArmor_classis_4:0 "Next Generation Valkyrie Armor"
BH3_sp_ValkyrieArmor_classis_4_desc:0 "The performance of existing Valkyrie Armor is approaching its limits. To meet new combat requirements, the development of a new Valkyrie Armor with stronger structure and enhanced capabilities is imminent."
BH3_sp_Doll:0 "Armed Doll"
BH3_sp_Doll_desc:0 "Armed Dolls are the intelligent combat partners of Valkyries. They possess independent consciousness and unique skills, providing various assists in battle. As an indispensable tactical extension of the Valkyries, they combine tactical value with emotional bonds."