#研究律者提示
BH3_tech.3.t:0 "Honkai Warning"
BH3_tech.3.d:0 "Captain,current Honkai concentration:§R[?global.BH3_Threat]§!§CHW§!,the research of Herrscher is available。"
BH3_tech.3.a:0 "OK"

#崩坏事件
BHS.10.t:0 "Divine Keys Affected by Honkai Energy"
BHS.10.d:0 "Our researchers report an emergency situation - the Honkai outbreak has caused drastic fluctuations in Honkai energy concentration. All Divine Keys in our possession are experiencing malfunctions. §RThe Zeroth Power cannot be activated§!"
BHS.10.a:0 "How long until repairs are complete?"

BHS.11.t:0 "Honkai Predict"
BHS.11.d:0 "The monitoring agency located in Country-§R[?global.BHSLandingCountry.GetName]§!,§R[?global.BHSLandingPoint.GetName]§! reported that the concentration of Honkai energy in this area has significantly increased, posing a risk of collapse disasters."
BHS.11.a:0 "It is expected to reach the critical point in about §R[?global.BHS_Landing_Left_Day]§! days, and we need to prepare in advance"

BHS.12.t:0 "Honkai Happened"
BHS.12.d:0 "As the concentration of Honkai skyrocketed to the warning line, a collapse disaster broke out in §R[?global.BHSLandingPoint.GetName]§!"
BHS.12.a:0 "Damn it"

BHS.13.t:0 "§RHigh Activity§!"
BHS.13.d:0 "Frontline troops report that the Honkai Beast has been §RHigh Activity§! recently"
BHS.13.a:0 "Defend!"

BHS.14.t:0 "§RMedium Activity§"
BHS.14.d:0 "Frontline troops report that the Honkai Beast has been in §RMedium Activity§! recently"
BHS.14.a:0 "Aren't they usually like this?"

BHS.15.t:0 "§RLow Activity§!"
BHS.15.d:0 "Frontline troops report that the Honkai Beast has been in §RLow Activity§! recently"
BHS.15.a:0 "It's time to counterattack!"

BHS.21.t:0 "Honkai §RLevel II§!"
BHS.21.d:0 "The latest report from the monitoring station indicates that the Honkai has further intensified. According to previous monitoring data comparison, the current Honkai is in §RLevel II§!"
BHS.21.a:0 "Attention"
BHS.22.t:0 "Honkai §RLevel III§!"
BHS.22.d:0 "The latest report from the monitoring station indicates that the Honkai has further intensified. According to previous monitoring data comparison, the current Honkai is in §RLevel III§!"
BHS.22.a:0 "Notify frontline troops to respond effectively."
BHS.23.t:0 "Honkai §RLevel IV§!"
BHS.23.d:0 "The latest report from the monitoring station indicates that the Honkai has further intensified. According to previous monitoring data comparison, the current Honkai is in §RLevel IV§!"
BHS.23.a:0 "Damn It"
BHS.24.t:0 "Honkai §RLevel V§!"
BHS.24.d:0 "The latest report from the monitoring station indicates that the Honkai has further intensified. According to previous monitoring data comparison, the current Honkai is in §RLevel V§!"
BHS.24.a:0 "Will we win?"

BHS.25.t:0 "Nuclear Winter Alert Honkai Beasts Acquire §RNuclear Corrosion Resistance§!"
BHS.25.d:0 "To counter the escalating Honkai threat, humanity deployed nuclear weapons against the Honkai. While this eliminated large numbers of Honkai Beasts, it triggered rapid genetic evolution within them, resulting in the emergence of §R Nuclear Corrosion Resistance§! — a targeted adaptation to nuclear blast energy and radiation. This exemplifies the Will of Honkai's 'precision evolution' against civilization's weapons, the more humanity relies on destructive arms, the deadlier the Honkai Beasts' adaptations become."
BHS.25.a:0 "Pandora's box has been opened."

HerrscherCome.101.t:0 "Herrscher of Reason Tips"
HerrscherCome.101.d:0 "1.Weekly reduction of 1% in research, production, and construction speed.\n2.Monthly deduction of 1 research slot from all human nations, with a minimum of 1 research slot remaining"
HerrscherCome.101.a:0 "Eliminate her as soon as possible."
HerrscherCome.201.t:0 "Herrscher of Void Tips"
HerrscherCome.201.d:0 "The Herrscher of Void uses her authority to propel meteorites from space toward Earth, randomly damaging buildings and military forces in three provinces of a country."
HerrscherCome.201.a:0 "Eliminate her as soon as possible."
HerrscherCome.203.t:0 "Skyfall Meteor"
HerrscherCome.203.d:0 "The Herrscher of Void uses her authority to propel meteorites from space toward Earth, damaging buildings and military forces in§R[?global.BH3_BHS_Invasion_HI2_hit_country.GetName],[?global.BH3_BHS_Invasion_HI2_hit_pos1.GetName],[?global.BH3_BHS_Invasion_HI2_hit_pos2.GetName],[?global.BH3_BHS_Invasion_HI2_hit_pos3.GetName]§!"
HerrscherCome.203.a:0 "Eliminate her as soon as possible."
HerrscherCome.203.b:0 "Hide this event."
HerrscherCome.301.t:0 "Herrscher of Thunder Tips"
HerrscherCome.301.d:0 "No additional mechanics. The offensive values of the Herrscher of Thunder's authority increase over time."
HerrscherCome.301.a:0 "Eliminate her as soon as possible."

HerrscherCome.601.t:0 "Herrscher of Rebirth Tips"
HerrscherCome.601.d:0 "Every 50 days, randomly targets a warring nation with 'Withering Death', applying a debuff and simultaneously applying Honkai erosion to 2 random provinces."
HerrscherCome.601.a:0 "Eliminate her as soon as possible."
HerrscherCome.604.t:0 "Withering Death"
HerrscherCome.604.d:0 "The Herrscher of Rebirth targets §R[?global.BH3_BHS_Invasion_HI6_hit_country.GetName] with Withering Death. The nation will suffer a national spirit debuff, while [?global.BH3_BHS_Invasion_HI6_hit_pos1.GetName] and [?global.BH3_BHS_Invasion_HI6_hit_pos2.GetName]§! will be affected by Honkai erosion."
HerrscherCome.601.a:0 "Eliminate her as soon as possible."
HerrscherCome.604.b:0 "Hide this event."
HerrscherCome.701.t:0 "Herrscher of Flamescion Tips"
HerrscherCome.701.d:0 "Every 20 days, there is a 25% chance to gain a 7-day attack buff."
HerrscherCome.701.a:0 "Eliminate her as soon as possible."
HerrscherCome.704.t:0 "Judgment of Shamash"
HerrscherCome.704.d:0 "he Herrscher of Flamescion unleashes her authority, gaining a 7-day attack buff."
HerrscherCome.704.a:0 "Eliminate her as soon as possible."
HerrscherCome.704.b:0 "Hide this event."
HerrscherCome.1201.t:0 "Herrscher of Erosion Tips"
HerrscherCome.1201.d:0 "1. Every 20 days, the Herrscher of Corruption will use its Authority to target a random player, obscuring the player's UI (does not affect functionality but causes visual obstruction);\n2.Upon emergence, the Herrscher of Erosion and the Honkai will establish their own intelligence agencies."
HerrscherCome.1201.a:0 "Eliminate her as soon as possible."
HerrscherCome.1204.t:0 "System Infiltration"
HerrscherCome.1204.d:0 "§R[?global.BH3_BHS_Invasion_HH2_hit_country.GetName]§!'s Hearts of Iron IV has been attacked by the Herrscher of Corruption!"
HerrscherCome.1204.a:0 "Eliminate her as soon as possible."
HerrscherCome.1204.b:0 "Hide this event."

#超事件
BH3_BHS_invasion_start_event_desc:0 "Honkai is a natural phenomenon with self-awareness that opposes the development of 'civilization.' At its core is a form of energy that does not obey the law of conservation of mass-energy in a single spacetime, known as 'Honkai Energy.' Honkai stands in opposition to human civilization, and as human technological civilization advances, the level of Honkai disasters gradually increases. During a Honkai disaster, various natural disasters emerge, posing a severe threat to humanity. Honkai disasters also give birth to Herrschers, whose mission is to end human civilization. These Herrschers possess immense power and abilities, making them humanity's primary enemies in the fight against Honkai.\nA severe Honkai disaster has erupted in §R[?global.BHS_StartLocation.GetName]§!."
BH3_BHS_invasion_start_event_btn_tt:0 "A Dark Era"
BH3_BHS_Invasion_Event_title_HI1_Come:0 "Birth of the Herrscher of Reason"
BH3_BHS_Invasion_Event_HI1_Come_desc:0 "Despite our proactive efforts, the Herrscher of Reason has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HI1_Come_btn_t:0 "We must defeat her quickly"
BH3_BHS_Invasion_Event_title_HI2_Come:0 "Birth of the Herrscher of Void"
BH3_BHS_Invasion_Event_HI2_Come_desc:0 "Despite our proactive efforts, the Herrscher of Void has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HI2_Come_btn_t:0 "Prepare for the next assault"
BH3_BHS_Invasion_Event_title_HI3_Come:0 "Birth of the Herrscher of Thunder"
BH3_BHS_Invasion_Event_HI3_Come_desc:0 "Despite our proactive efforts, the Herrscher of Thunder has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HI3_Come_btn_t:0 "We still have a chance to defeat her."

BH3_BHS_Invasion_Event_title_HI6_Come:0 "Birth of the Herrscher of Rebirth"
BH3_BHS_Invasion_Event_HI6_Come_desc:0 "Despite our proactive efforts, the Herrscher of Rebirth has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HI6_Come_btn_t:0 "We do not fear death"
BH3_BHS_Invasion_Event_title_HI7_Come:0 "Birth of the Herrscher of Flamescion"
BH3_BHS_Invasion_Event_HI7_Come_desc:0 "Despite our proactive efforts, the Herrscher of Flamescion has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HI7_Come_btn_t:0 "Organize defenses immediately"
BH3_BHS_Invasion_Event_title_HH2_Come:0 "Birth of the Herrscher of Erosion"
BH3_BHS_Invasion_Event_HH2_Come_desc:0 "Despite our proactive efforts, the Herrscher of Erosion has still been born in §R[?global.BHSLandingPoint.GetName]§!."
BH3_BHS_Invasion_Event_HH2_Come_btn_t:0 "Hey, did you miss me?"

BH3_BHS_Invasion_Event_title_HI1_Beaten:0 "Herrscher of Reason Defeated"
BH3_BHS_Invasion_Event_HI1_Beaten_desc:0 "§R[?global.Who_beat_HI1.GetName]§! has defeated the Herrscher of Reason, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HI1.GetName]§!."
BH3_BHS_Invasion_Event_HI1_Beaten_btn_t:0 "A Glimmer of Hope in Despair!"
BH3_BHS_Invasion_Event_title_HI2_Beaten:0 "Herrscher of Void Defeated"
BH3_BHS_Invasion_Event_HI2_Beaten_desc:0 "§R[?global.Who_beat_HI2.GetName]§! has defeated the Herrscher of Void, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HI2.GetName]§!."
BH3_BHS_Invasion_Event_HI2_Beaten_btn_t:0 "Well Done!"
BH3_BHS_Invasion_Event_title_HI3_Beaten:0 "Herrscher of Thunder Defeated"
BH3_BHS_Invasion_Event_HI3_Beaten_desc:0 "§R[?global.Who_beat_HI3.GetName]§! has defeated the Herrscher of Thunder, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HI3.GetName]§!."
BH3_BHS_Invasion_Event_HI3_Beaten_btn_t:0 "One Step Closer to Victory!"

BH3_BHS_Invasion_Event_title_HI6_Beaten:0 "Herrscher of Rebirth Defeated"
BH3_BHS_Invasion_Event_HI6_Beaten_desc:0 "§R[?global.Who_beat_HI6.GetName]§! has defeated the Herrscher of Rebirth, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HI6.GetName]§!."
BH3_BHS_Invasion_Event_HI6_Beaten_btn_t:0 "Press On!"
BH3_BHS_Invasion_Event_title_HI7_Beaten:0 "Herrscher of Flamescion Defeated"
BH3_BHS_Invasion_Event_HI7_Beaten_desc:0 "§R[?global.Who_beat_HI7.GetName]§! has defeated the Herrscher of Flamescion, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HI7.GetName]§!."
BH3_BHS_Invasion_Event_HI7_Beaten_btn_t:0 "What Herrscher Will Come Next?"
BH3_BHS_Invasion_Event_title_HH2_Beaten:0 "Herrscher of Erosion Defeated"
BH3_BHS_Invasion_Event_HH2_Beaten_desc:0 "§R[?global.Who_beat_HH2.GetName]§! has defeated the Herrscher of Erosion, and the Herrscher Core has been reclaimed by §R[?global.Who_beat_HH2.GetName]§!."
BH3_BHS_Invasion_Event_HH2_Beaten_btn_t:0 "Pathetic imitator!"

BH3_BHS_Invasion_Event_title_HI1_Reward:0 "Truth"
BH3_BHS_Invasion_Event_HI1_Reward_desc:0 "Forged from the 'Tsumukari Muramasa', it allows mortals to perceive the laws of the universe, deconstruct all things, and recreate miracles.\n(§R[?global.Who_beat_HI1.GetName]§! has gained the Authority of the Herrscher of Reason.)"
BH3_BHS_Invasion_Event_HI1_Reward_btn_t:0 "Good"
BH3_BHS_Invasion_Event_title_HI2_Reward:0 "Heaven"
BH3_BHS_Invasion_Event_HI2_Reward_desc:0 "Forged from the 'Ame-no-Murakumo', it turns the heavens into walls, making it difficult for calamitous gods to traverse dimensions.\n(§R[?global.Who_beat_HI2.GetName]§! has gained the Authority of the Herrscher of Void.)"
BH3_BHS_Invasion_Event_HI2_Reward_btn_t:0 "Good"
BH3_BHS_Invasion_Event_title_HI3_Reward:0 "Roar"
BH3_BHS_Invasion_Event_HI3_Reward_desc:0 "Forged from the 'Kusanagi-no-Tsurugi', it allows lightning to tear through the sky, delivering divine punishment with starfall and thunder.\n(§R[?global.Who_beat_HI3.GetName]§! has gained the Authority of the Herrscher of Thunder.)"
BH3_BHS_Invasion_Event_HI3_Reward_btn_t:0 "Good"

BH3_BHS_Invasion_Event_title_HI6_Reward:0 "Life"
BH3_BHS_Invasion_Event_HI6_Reward_desc:0 "Forged from the 'Ishikori-dome', it causes flowers to bloom amidst desolate graves, as life and death flow endlessly.\n(§R[?global.Who_beat_HI6.GetName]§! has gained the Authority of the Herrscher of Rebirth.)"
BH3_BHS_Invasion_Event_HI6_Reward_btn_t:0 "Good"
BH3_BHS_Invasion_Event_title_HI7_Reward:0 "Inferno"
BH3_BHS_Invasion_Event_HI7_Reward_desc:0 "Forged from the 'Kagutsuchi', it allows scorching flames to engulf the mortal world, blazing brightly and illuminating the heavens.\n(§R[?global.Who_beat_HI7.GetName]§! has gained the Authority of the Herrscher of Flamescion.)"
BH3_BHS_Invasion_Event_HI7_Reward_btn_t:0 "Good"
BH3_BHS_Invasion_Event_title_HH2_Reward:0 "Devour"
BH3_BHS_Invasion_Event_HH2_Reward_desc:0 "Forged from the blade that slew 'Yasomagatsubi', it can corrode and decay the eternal world, confusing gods and ghosts, and splitting souls.\n(§R[?global.Who_beat_HH2.GetName]§! has gained the Authority of the Herrscher of Erosion.)"
BH3_BHS_Invasion_Event_HH2_Reward_btn_t:0 "Good"

BH3_BHS_Invasion_Event_title_MoonBattleStart1:0 "Dawn of Victory"
BH3_BHS_Invasion_Event_MoonBattleStart_desc1:0 "The human alliance has repelled multiple Honkai outbreaks and reclaimed vast lost territories. However, the true final battle awaits on the moon—only by actively confronting the Herrscher of Finality can the root of the Honkai be severed.\n\n§R(Due to high Honkai surrender progress, the Moon Battle will trigger. The outcome will be determined by the number of SSS-rank Valkyries and total Valkyrie combat power.)§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t1:0 "To the Moon!"
BH3_BHS_Invasion_Event_title_MoonBattleStart2:0 "Dawn of Victory"
BH3_BHS_Invasion_Event_MoonBattleStart_desc2:0 "Humans have defeated all Herrschers, yet true victory remains elusive—we must eliminate the Herrscher of Finality before its full awakening to truly conclude this civilization.\n\n§R(Having defeated all Herrschers, the Moon Battle will trigger. The outcome will be determined by the number of SSS-rank Valkyries and total Valkyrie combat power.)§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t2:0 "Just Another Herrscher"
BH3_BHS_Invasion_Event_title_MoonBattleStart3:0 "Embers of Civilization"
BH3_BHS_Invasion_Event_MoonBattleStart_desc3:0 "The Honkai erosion has consumed the world, claiming §R[?global.HonkaiImpact_Cause_Population_Casualty]§! million lives, §R[?global.HonkaiImpact_Cause_Population_Casualty_p]%§! of the total population. Human defenses have collapsed across continents, with remaining forces unable to mount effective resistance. The flame of human civilization flickers in the wind. Though the Herrscher of Finality on the moon remains a theoretical last hope, Earth can no longer muster a complete expeditionary force.\n\n§R(Moon Battle defeat triggered directly due to human population loss exceeding 70%.)§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t3:0 "No Hope Left"

BH3_BHS_Invasion_Event_title_MoonBattleWin:0 "Final Strike & Moon Battle"
BH3_BHS_Invasion_Event_MoonBattleWin_desc:0 "The Herrscher of Finality has emerged, launching a devastating extraterrestrial strike that caused widespread Honkai disasters across Earth. Humanity's warriors embarked on spacecrafts to the Moon for the final confrontation.\nThe Herrscher's body disintegrated on the lunar surface, dissolving into countless particles of light across the void. The final trial - the Cocoon of Finality - now lies before us. Yet the Herrscher's strike has spawned new Honkai Beasts. Unless we §Renter the Cocoon of Finality§! in time, human civilization will still face reboot."
BH3_BHS_Invasion_Event_MoonBattleWin_btn_t:0 "Victory is within reach"
BH3_BHS_Invasion_Event_title_MoonBattleLose:0 "Final Strike & Moon Battle"
BH3_BHS_Invasion_Event_MoonBattleLose_desc:0 "The Herrscher of Finality has emerged, delivering an apocalyptic blow from beyond Earth that reduced cities to ruins in moments. Humanity's warriors mustered their remaining strength, boarding the last operational spacecrafts to the Moon.\nOn the despair-ridden lunar battlefield, the Herrscher looks down upon all life. Her power far exceeds expectations - every attack tears through space itself, every gaze freezes souls. §R'You... are but insects after all.'§! The Honkai denies even the §R'qualification for trial'§!. §R'Civilization unworthy. The cycle continues.'§!"
BH3_BHS_Invasion_Event_MoonBattleLose_btn_t:0 "The End of Days, Heaven's Decree"
BH3_BHS_Invasion_Event_title_EnterHive:0 "Entering the Cocoon of the End"
BH3_BHS_Invasion_Event_EnterHive_desc:0 "The Cocoon of the End is an object created by an alien civilization, possessing the ability to manipulate fate and cycle the civilizations of other planets. Before landing on Earth, it had already visited other planets in the solar system, with Earth being its final destination. Perhaps due to the vast dimensional gap between the Herrscher of the End and humanity, this 'embrace' is always filled with errors. Thus, the Herrscher of the End uses repeated trials to seek the 'correct answer' for this 'embrace'—recycling planets, erasing civilizations, and resetting everything to the beginning."
BH3_BHS_Invasion_Event_EnterHive_btn_t:0 "Expel All Honkai."
BH3_BHS_invasion_end_event_title_desc:0 "Transcending the End"
BH3_BHS_invasion_end_event_desc:0 "Since the unprecedented Honkai disaster swept across the globe, the human world seemed to have plunged into a precarious situation overnight. As of [GetDate], [?global.HonkaiImpact_Beat_Country_Num|R0] countries have ceased to exist, with as many as [?global.HonkaiImpact_Cause_Population_Casualty|R0] million people swallowed by the Honkai into endless darkness. The total human population has been reduced to [?global.HonkaiImpact_Remain_Population_Casualty|R0] million.\nHowever, it was precisely in this critical moment of human survival that our species demonstrated unprecedented resilience. [?global.HonkaiImpact_Cause_Casualty|R0] million brave warriors stepped forward, shining like stars in the darkness, using their lives and blood to build a Great Wall defending human dignity and hope.\nIn this unprecedented struggle, we gathered boundless wisdom and strength, using technology, strategy, and courage to successfully eliminate [?global.HonkaiImpact_Casualty|R0] million Honkai Beasts. Behind this number lies countless life-and-death battles, sweat, and tears. After enduring endless suffering and struggle, humanity has transcended the brink of the end and finally welcomed rebirth and hope."
BH3_BHS_invasion_end_event_btn_tt:0 "Everyone is a Hero!"

#新闻
BHS_news.1.t1:0 "Honkai Destroys [?global.bhs_beat_country.GetName]"
BHS_news.1.d1:0 "Under the onslaught of Honkai, [?global.bhs_beat_country.GetName] has ceased to exist. The once-thriving cities have turned into ruins, with deathly silence pervading the broken walls and shattered streets. The wind howls through the desolate streets, carrying dust and whispers of past glory and present desolation.\nAmidst the ruins, scenes of broken families are heartbreaking. Shattered windows and doors reveal scattered furniture and family belongings, silently recounting past warmth and present sorrow. The laughter of children, the quarrels of couples, and the advice of elders—all these familiar sounds have been replaced by silence.\nOccasionally, survivors can be seen wandering the ruins, their eyes filled with despair and helplessness. They have lost their families, their homes, and even their hope for the future. Their hearts are filled with pain and regret, but in this Honkai-ravaged world, they can only endure silently, powerless to change their fate."
BHS_news.1.a:0 "We Are Powerless."
BHS_news.1.t2:0 "Honkai Ravages [?global.bhs_beat_country.GetName]"
BHS_news.1.d2:0 "[?global.bhs_beat_country.GetName] has suffered an unprecedented Honkai disaster. Once-thriving cities have turned into ruins under the onslaught of Honkai energy. Skyscrapers have collapsed into rubble, and the streets are littered with the remains of Honkai Beasts and scorched debris. The air is thick with the smell of burnt earth and dust, and the sky is shrouded in dark clouds, casting a pall of gloom and despair over the city.\nThe city's lights have gone out, and the once-bustling streets are now eerily silent. Homes have been destroyed by Honkai, and the laughter and warmth of the past have vanished. The streets are strewn with torn clothes and scattered belongings, silently telling the story of past happiness and present tragedy.\nSurvivors, pale and terrified, wander aimlessly, their eyes filled with fear and helplessness. They have lost their loved ones, their homes, and their hope for the future. In this Honkai-ravaged land, their hearts are filled with endless sorrow and despair. The entire nation seems trapped in a nightmare from which it cannot awaken, mercilessly devoured by the power of Honkai."
BHS_news.1.a:0 "We Are Powerless."
BHS_news.1.t3:0 "[?global.bhs_beat_country.GetName]'s Army Still Holds On"
BHS_news.1.d3:0 "Honkai has erupted in [?global.bhs_beat_country.GetName], destroying everything in its path. Once-glorious cities are now in ruins, with shattered streets and collapsed skyscrapers. The air is thick with dust and smoke, and the sky is shrouded in darkness, as if the sun will never rise again.\nThe army continues to resist, but they are gradually being overwhelmed by the relentless onslaught of Honkai Beasts. Their equipment is battered, and their weapons grow heavier with each swing. Every sword strike, every shot, drains their remaining strength and will. The nation's army is still active on various battlefields, but they face unprecedented pressure from the sheer number of Honkai Beasts.\nLife on this land is slowly fading, and the army's resistance is nearing its limit. Yet, they continue to hold their ground, defending this land with their last ounce of strength. Their eyes reflect determination and resilience, knowing that even in the face of overwhelming odds, they must persevere. For they know that as long as there is a glimmer of hope, they must fight on."
BHS_news.1.a:0 "We Are Powerless."
BHS_news.1.t4:0 "We Have Lost All Contact with [?global.bhs_beat_country.GetName]"
BHS_news.1.d4:0 "[?global.bhs_beat_country.GetName] has suffered a devastating blow and has completely lost all contact with the outside world. Once-thriving cities are now in ruins, with skyscrapers reduced to rubble under the onslaught of Honkai energy. The streets are torn apart by the claws of Honkai Beasts, and the air is thick with dust and smoke. The sky is shrouded in darkness, with no sunlight piercing the heavy clouds.\nAmidst the ruins, survivors flee in all directions, searching for loved ones, but more often than not, they are met with despair and helpless cries. They try to contact the outside world, but all communication devices have failed, their signals jammed by Honkai energy. They are trapped in this desolate land, isolated and without aid.\nThis nation seems to have been forgotten by the world. No one knows the suffering and struggles they endure, and no one can lend a helping hand. The survivors can only rely on their own strength to survive in this wasteland. They face the threat of Honkai Beasts, scarce resources, and endless loneliness and fear."
BHS_news.1.a:0 "We Are Powerless."