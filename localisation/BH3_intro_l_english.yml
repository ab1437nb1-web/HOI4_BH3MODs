BH3_Intro_Window_Update_Container_Content_t:0 "§BOctober 4, 2025 Update§!\n§RBalance Changes§!\n1. Increased Valkyrie (personnel) production cost, now available for leasing;\n2. Adjusted Valkyrie cabinet stats;\n3. Increased combat damage probability against land forts;\n4. Adjusted Honkai Beast templates and stats;\n5. Modified effects of Void Archives and Cosmic Juggernaut's Zeroth Power Rating;\n6. Increased Army Experience cost for Valkyrie doctrines.\n§RBug Fixes§!\n1. Fixed incorrect HP modifier in the first Valkyrie doctrine;\n2. Changed Honkai unit templates to English-only to resolve display issues in the English version;\n3. Fixed issue where Valkyrie support wouldn't spawn Valkyrie units for AI in Honkai Eruption mode.\n§RNew Features§!\n1. Added Herrscher of Corruption to Honkai Eruption mode;\n2. Added Elysia - Miss Pink Elf model, available in 4th-gen Valkyrie armor selection;\n3. Old Valkyries can no longer be produced; corresponding equipment is auto-created upon research completion with adapted models;\n4. Added Honkai Zombies with extremely high HP and organization, adjusted Honkai unit spawn ratios (Zombies now over 50%);\n5. Added 2 new cabinet positions and attack/defense modifiers affecting all Valkyries.\n\n§BOctober 4, 2025 Update§!\nBalance Changes\n1. Adjusted Valkyrie doctrines to benefit Valkyrie armor chassis;\n2. Old Valkyrie unit research no longer unlocks battalion templates.\nBug Fixes\n1. Fixed incorrect province icon for Star of Eden effects;\n2. Replaced icons for certain decisions.\nNew Features\n1. Added Valkyrie armor chassis and numerous components, advanced chassis/components obtainable through Valkyrie research and special projects;\n2. New 'Valkyrie' battalion template using Valkyrie armor chassis and personnel;\n3. Added 3 special projects,Improved Honkai Reactor, Valkyrie Super-Heavy Armor Structure, and Armed Dolls;\n4. Valkyrie personnel automatically trained via decisions; Grade A+ require increasing Valkyrie commander ranks, B and A grades can be expanded through Valkyrie School upgrades.\n\n§BJune 1, 2025 Update§!\nBalance Changes\n1. Adjusted Herrscher of Thunder authority effects in Honkai Eruption;\n2. Modified Finality Strike debuff effects;\n3. Enhanced Finality Strike damage to buildings;\n4. Revised Honkai industrial scaling buff - now calculates based on global human nation industry, with >1000 factories contributing 0.05% each;\n5. Reduced Stellar Ring trait bonuses;\n6. Weakened all Valkyrie rank traits;\n7. Nerfed base stats of Divine Key equipment, reduced support company requirements and special forces bonuses, increased organization but also cost;\n8. Significantly increased Valkyrie equipment production costs.\nBug Fixes\n1. Fixed non-Honkai nations being annexed if allied/puppet/overlord of Honkai;\n2. Rearranged conflicting button positions for obtaining Schicksal tech and Captain commanders.\nNew Features\n1. Valkyrie commanders no longer distinguished by armor - different armors of same character yield one commander, portraits change with rank-ups via upgrade events;\n2. Valkyrie Power system calculates scores based on commander rank, traits, battle results, awarding Regional/World's Strongest Valkyrie traits;\n3. Valkyrie Power system adds dynamic attack/defense bonuses to all player-controlled nations;\n4. Moon Battle victory now requires specific SSS Valkyrie numbers and power thresholds;\n5. Added Moon Battle failure condition - auto-defeat if Honkai corruption reaches 60% total population;\n6. After Moon Battle failure, Beast of this World conducts weekly province bombing vs human nations;\n7. Added political advisors, Luna Kindred, Eden, Fu Hua.\nSongs\nAdded Incarnation;\n\n§BMarch 29, 2025 Update§!\n1. Added new UI window for setting active characters;\n2. Herrscher commanders now trigger ultimate animations when using skills.\n\n§BFebruary 21, 2025 Update§!\n1. Greatly increased Ganesha and Benares organization;\n2. Significantly strengthened 'Honkai Enhancement' buff in Eruption mode;\n3. Added air units for Honkai (maintained at limited scale);\n4. Locked Herrscher of Reason training, set research slots to 0;\n5. Added 3x unit spawn option for Honkai Eruption;\n6. Added Herrscher unit enhancement option, allowing Herrscher commanders in Honkai faction to use unique skills.\n\n§BFebruary 4, 2025 Update§!\n1. Added 2 Herrschers to Honkai faction, Herrscher of Death and Herrscher of Flame;\n2. In Honkai Eruption mode, Herrscher emergence sequence determined by national focuses, creating unique sequences each game under AI control."
BH3_Intro_Window_HowPlay_Sub_btn1_t:0 "Mod Activation"
BH3_Intro_Window_HowPlay_Container1_Content_t:0 "§BHow to Activate This Mod§!\nEnable via decisions. Click §RHyperion jumps to this world bubble§!. Besides the §RHonkai Impact 3rd Mod§! decision category, there are also §RValkyrie§! and §RDivine Key§! categories. Details in dedicated sections.\n\n§BHow to Start Honkai Eruption§!\nActivate via decision, §ROpen Honkai Eruption mode interface (configurable outbreak time)§!. See dedicated section for details.\n\n§BAI Nations Use Valkyrie Commanders, Cabinets, Divine Keys, etc.§!\nWhen enabled, major AI-controlled nations will use Valkyrie commanders and cabinet advisors from this mod, while also researching Divine Keys. To increase challenge, after some time, major AI nations will spawn large numbers of Valkyrie units.\n\n§BAi-chan, Captain, the Valkyries are ready. Please proceed to the Hyperion for command!§!\nClicking this decision opens a special interface including §RValkyrie Technology§! and §RCombat Doctrines§!. This interface is also accessible via the Hyperion icon in the bottom-right corner.\n\n§BHyperion Movement and Fire Support§!\n1. After clicking §RHyperion jumps to this world bubble§!, a Hyperion model appears above your capital. Move it via buttons in the §Rprovince interface§!;\n2. After completing §RHyperion main cannon charge§! via decision, use the fire button in the §Rprovince interface§! to damage enemy forces in that province. Alternatively, use the fire button in the bottom-right Hyperion icon (requires §RHyperion Firepower Upgrade§! in air research);\n3. The Hyperion's province grants a player-only modifier, §RHyperion Fire Support§!;\n4. The Hyperion provides a unique combat modifier for its province, viewable in province interface.\n\n§BRaise construction funds for St. Freya Academy, simultaneously upgrading Valkyrie Academy to Lv.1§!\nThis decision primarily enables use of the special military factory §RSt. Freya Academy§!, which reduces production cost and improves equipment for Herrscher units.\n\n"
BH3_Intro_Window_HowPlay_Sub_btn2_t:0 "Valkyrie Technology"
BH3_Intro_Window_HowPlay_Container2_Content_t:0 "§BValkyrie Unit Research§!\nIn the §RValkyrie Technology§! interface, select Valkyrie portraits to enter specific research screens. Completed research automatically grants the Valkyrie's tech, commander, and template designer. Players can then organize Valkyrie units as needed.\n\n§BValkyrie Tech Research Requirements§!\nInitially, only §RField Outfit, White Comet§!, §RPulse Outfit, Crimson Impulse§!, and §RValkyrie, Chariot§! are available. Higher-tier Valkyrie tech typically requires researching the previous tier. Check specific requirements by hovering over Valkyrie armor icons.\n\n§BObtaining Herrschers§!\n1. Herrschers are also researched in the Valkyrie interface, but only when §RHonkai energy concentration >1000HW (global tension >40%)§!;\n2. In §RHonkai Eruption§! mode, must enable §RAllow Herrscher use§! during setup;\n3. Under sufficient Honkai concentration, owning Herrscher tech automatically grants 1 corresponding core equipment every 7 days. Mass production is also possible via §RSt. Freya Academy's§! first trait §RFar East Anomaly§!, which greatly reduces costs.\n\n§BValkyrie Armor§!\n1. Completing Valkyrie research provides free armor template and chassis in production interface, plus a Valkyrie unit template;\n2. Valkyrie units require §RValkyrie Armor§! (produced) and §RValkyries§! (special acquisition);\n3. §R1st-gen§! corresponds to B-rank, §R2nd-gen§! to A-rank, §R3rd-gen§! to S-rank, §R4th-gen§! to SS-rank, §RNext-gen§! requires experimental research;\n4. Divine Key and Armed Doll components for armor designer require experimental research.\n\n§BSet National Leader§!\nBelow each Valkyrie icon are §RB, A, S, SS rank§! buttons. Clicking sets that Valkyrie as national leader. §RWarning§!, Some national focuses lock leader names; setting a Valkyrie may break focus functionality.\n\n§BValkyrie Equipment Upgrades§!\n1. Upgrade Valkyrie equipment via military factory §RSchicksal - Helheim Lab§!;\n2. Upgrade Herrscher equipment via §RSt. Freya Academy§! (requires decision, §RRaise construction funds for St. Freya Academy...§!).\n\n"
BH3_Intro_Window_HowPlay_Sub_btn3_t:0 "Valkyrie Commanders"
BH3_Intro_Window_HowPlay_Container3_Content_t:0 "§BObtaining Valkyrie Commanders§!\n1. Click §RGet all Valkyrie commanders (excluding Herrschers)§! in the §RValkyrie§! decisions;\n2. For individual commanders, complete corresponding Valkyrie tech research.\n\n§BObtaining Herrscher Commanders§!\nCurrently requires completing Herrscher research in the §RValkyrie Technology§! interface.\n\n§BValkyrie Commander Rank Progression§!\n1. Each Valkyrie commander starts with §RB-rank§! or §RA-rank Valkyrie trait§!, improved through commanding army battles;\n2. More troops commanded = faster experience gain;\n3. Check progress by hovering over commander portrait (shows §RA-rank Valkyrie combat experience§! trait);\n4. Commander portraits automatically update upon gaining new rank traits.\n\n§BHerrscher Skills§!\nHerrscher commanders have special skills activated with CP in army command interface, providing attack bonuses and playing skill animations.\n\n§BValkyrie Training§!\n1. Valkyrie units require §RValkyrie Armor§! (produced) and §RValkyries§! (special acquisition);\n2. §RValkyries§! equipment is automatically obtained via decisions after mod activation;\n3. Decision §RExpand Valkyrie Academy§! increases B/A-rank equipment yield (higher ranks unaffected);\n4. High-rank equipment requires corresponding commander rank traits. SSS-rank commanders still automatically receive A-rank equipment.\n\n§BCommander Portrait Switching§!\n1. Portraits auto-update with higher rank traits;\n2. Manual switching via portrait buttons in §RValkyrie§! decisions disables auto-switching.\n\n"
BH3_Intro_Window_HowPlay_Sub_btn4_t:0 "Combat Doctrines"
BH3_Intro_Window_HowPlay_Container4_Content_t:0 "In the §RCombat Doctrines§! interface, spend Army Experience to unlock land doctrines. Some doctrines only affect Valkyrie units. Hover over doctrines to view specific bonuses."
BH3_Intro_Window_HowPlay_Sub_btn5_t:0 "Divine Keys"
BH3_Intro_Window_HowPlay_Container5_Content_t:0 "§BDivine Key Research§!\n1. Unlock Divine Keys through experimental research;\n2. Most researched in army facilities, §RCosmic Juggernaut§! in air facilities;\n3. Completing research adds corresponding national spirit and grants 100 units of Divine Key equipment (used for activating §RZeroth Power Rating§! via decisions);\n4. Also provides special components for Valkyrie armor.\n\n§BZeroth Power Rating§!\n1. View/activate in §RDivine Key§! decisions;\n2. Check decision requirements and effects for activation conditions.\n\n"
BH3_Intro_Window_HowPlay_Sub_btn6_t:0 "Honkai Eruption"
BH3_Intro_Window_HowPlay_Container6_Content_t:0 "§BGameplay Introduction§!\nClick §ROpen Honkai Eruption mode interface (configurable outbreak time)§! in decisions to setup/start Honkai. Configure outbreak location/time. Honkai emerges in a province, periodically spawning Herrschers with unique skills. Players must defeat both Honkai and Herrschers.\n\n§BHonkai Escalation§!\nHonkai strength increases with game time, Honkai energy concentration, and global industry.\n\n§BHonkai Herrschers§!\nHonkai spawns Herrschers as separate nations. Currently 6 Herrschers with unique mechanics. Eliminate them early or defeat them to gain their authority.\n\n§BEnd Conditions§!\nEither defeat Honkai or be defeated. Honkai surrender progress triggers phases with super events and decisions as indicators.\n\n§BDifficulty Selection§!\nDue to HOI4's pseudo-randomness, 'random' outbreaks may fix locations. Control outbreak locations by switching nations. Note, specified outbreak provinces use vanilla map; major map mods may cause mismatches.\n\n"
BH3_Intro_Window_Other_Container_Content_t:0 "§BIssue Reporting§!\nLeave comments in this mod's Steam Workshop page.\n\n§BCompatibility§!\nCompatible with most mods. TNO currently causes crashes (see Steam Workshop discussions for workarounds).\n\n§BMiscellaneous§!\nIf you enjoy this mod, please like it on Steam Workshop. Also check out author's other mod, §RAzur Lane Shipgirl Models - AzurLaneModel§!, compatible with Ironman mode and other Azur Lane mods."