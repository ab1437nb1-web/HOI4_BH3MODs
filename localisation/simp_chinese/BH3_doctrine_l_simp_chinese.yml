BH3_doctrine_folder_valkyrie:0 "女武神作战学说"
BH3_grand_doctrine_valkyrie:0 "对崩坏作战理论"
BH3_grand_doctrine_valkyrie_desc:0 "以女武神小队为核心、面向崩坏兽与常规战争的双重作战体系。解锁后可在七条学说线中继续钻研：步兵协同 / 战斗支援 / 装甲突击 / 作战行动 / 近战攻坚 / 律者降临 / 女武神特战。"
BH3_doctrine_track_assault:0 "近战攻坚"
BH3_doctrine_track_herrscher:0 "律者降临"
BH3_doctrine_track_special:0 "女武神特战"
BH3_doctrine_track_infantry:0 "步兵协同"
BH3_doctrine_track_support:0 "战斗支援"
BH3_doctrine_track_armor:0 "装甲突击"
BH3_doctrine_track_operations:0 "纵深作战"
BH3_sd_bh3_sd_close_combat:0 "§Y近接歼灭战术§!"
BH3_sd_bh3_sd_close_combat_desc:0 "整合旧学说树近战线主干与防御分叉：近接歼灭→快速接敌→武装侦查→动态防御→战场救火队→后发制人。随轨道精通逐级解锁，全部达成后等同旧线完全体。"
bh3_rwd_1_2:0 "快速接敌"
bh3_rwd_1_3:0 "武装侦查"
bh3_rwd_1_4_2:0 "动态防御"
bh3_rwd_1_5_2:0 "战场救火队"
bh3_rwd_1_6_2:0 "后发制人"
BH3_sd_bh3_sd_persistence:0 "§Y持久攻势§!"
BH3_sd_bh3_sd_persistence_desc:0 "整合旧学说树近战线进攻分叉：持久攻势→弱点洞悉→天元突破。反装甲输出与总攻能力的极致。"
bh3_rwd_1_5_1:0 "弱点洞悉"
bh3_rwd_1_6_1:0 "天元突破"
BH3_sd_bh3_sd_rear_ops:0 "§Y敌后作战§!"
BH3_sd_bh3_sd_rear_ops_desc:0 "整合旧学说树特战线前段：敌后作战→战斗穿插→空降突击→专业训练。女武神小队的特种作战体系。"
bh3_rwd_3_2:0 "战斗穿插"
bh3_rwd_3_3:0 "空降突击"
bh3_rwd_3_4:0 "专业训练"
BH3_sd_bh3_sd_ranged_suppression:0 "§Y远程压制战术§!"
BH3_sd_bh3_sd_ranged_suppression_desc:0 "整合旧学说树支援线：远程压制→抵近观测→火力调配→弹幕覆盖→全域压制。以火力与制空为核心的支援体系。"
bh3_rwd_2_2:0 "抵近观测"
bh3_rwd_2_3:0 "火力调配"
bh3_rwd_2_5_1:0 "弹幕覆盖"
bh3_rwd_2_6:0 "全域压制"
BH3_sd_bh3_sd_dispersed_support:0 "§Y分散支援§!"
BH3_sd_bh3_sd_dispersed_support_desc:0 "整合旧学说树支援线协同分叉与特战线终点：分散支援→协调支援→联合兵种→协同作战。大军团协同与纵深作战。"
bh3_rwd_2_4_2:0 "协调支援"
bh3_rwd_2_5_2:0 "联合兵种"
bh3_rwd_3_6:0 "协同作战"
BH3_sd_bh3_sd_herrscher_awaken:0 "§Y律者觉醒§!"
BH3_sd_bh3_sd_herrscher_awaken_desc:0 "律者之力降临战场。轨道精通达到 100 时，进一步解锁「律者统御」。"
bh3_rwd_herrscher_rule:0 "律者统御"
BH3_sd_bh3_sd_superior_numbers:0 "§Y优势兵力§!"
BH3_sd_bh3_sd_superior_numbers_desc:0 "以数量与编制宽度取胜：旅编制额外一列，特种兵力上限提升。与「精益求精」互斥。"
BH3_sd_bh3_sd_refined:0 "§Y精益求精§!"
BH3_sd_bh3_sd_refined_desc:0 "以质量强化取胜：全体女武神攻击与装甲全面提升。与「优势兵力」互斥。"