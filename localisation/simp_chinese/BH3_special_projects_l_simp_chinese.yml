BH3_sp_ValkyrieArmor_Engine_HonkaiImproved:0 "改良崩坏能反应炉驱动"
BH3_sp_ValkyrieArmor_Engine_HonkaiImproved_desc:0 "对用于女武神装甲驱动的崩坏能反应炉进一步优化升级，以获取更大出力。"
BH3_sp_ValkyrieArmor_classis_4:0 "次时代女武神装甲"
BH3_sp_ValkyrieArmor_classis_4_desc:0 "现有女武神装甲的性能已趋近极限。为满足新的作战需求，研发一款结构更坚固、性能更强的全新女武神装甲迫在眉睫。"
BH3_sp_Doll:0 "武装人偶"
BH3_sp_Doll_desc:0 "武装人偶是女武神的智能作战伙伴，她们拥有独立意识与专属技能，能在战斗中提供多种辅助，是女武神不可或缺的战术延伸，兼具战术价值与情感羁绊。"
