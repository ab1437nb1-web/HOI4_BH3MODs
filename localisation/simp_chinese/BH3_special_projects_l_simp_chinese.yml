BH3_sp_Void_Archives:0 "§R第一神之键：虚空万藏§!"
BH3_sp_Void_Archives_desc:0 "以前文明纪元第一律者·理之律者的核心制成的武器，能够复制使用者理解构造原理的武器及道具，内为几乎无限延伸的知识空间。不过其真正的力量似乎被封印了…"
