BH3_sp_OathofJudah:0 "§R第十一神之键：犹大的誓约§!"
BH3_sp_OathofJudah_desc:0 "上一个时代文明留下的超神兵，拥有最强的“封印”之力，展开之后，在十字架附近的敌人会被禁锢，夺去其行动能力，并将其体内的崩坏能彻底无效化。如何发挥其全部力量还需研究。"
