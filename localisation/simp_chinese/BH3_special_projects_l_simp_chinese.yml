BH3_sp_StarofEden:0 "§R第九神之键：伊甸之星§!"
BH3_sp_StarofEden_desc:0 "由旧文明第九律者的核心制成的神之键，拥有操纵重力的力量。最早出土于黄石遗迹，后在20世纪被天命北美支部的科学家们获得，并成为逆熵组织独立的关键之一。其使用方式尚未解析完整…"
