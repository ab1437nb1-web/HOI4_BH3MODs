BH3_sp_Void_Archives_idea_desc:0 "§Y这把武器的力量已被唤醒§!\n以前文明纪元第一律者·理之律者的核心制成的武器，能够复制使用者理解构造原理的武器及道具，内为几乎无限延伸的知识空间。"
