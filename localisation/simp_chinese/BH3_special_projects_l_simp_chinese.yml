BH3_sp_Honkai_Fission_Bomb:0 "§R崩坏裂变弹§!"
BH3_sp_Honkai_Fission_Bomb_desc:0 "§R崩坏裂变弹为应对律者级威胁而准备的最终手段。它的原理是基于崩坏能的可控链式反应，可以看作是崩坏能版本的“核弹”，其威力远超人类自身的核武器§!"
BH3_Honkai_Fission_Bomb_Completed_tt:0 "解锁§R崩坏裂变弹打击§!，可在右侧袭击界面规划打击计划"
tooltip_raid_category_BH3_Honkai_Fission_Bomb_Raids:0 "§R崩坏裂变弹打击§!\n由携带崩坏裂变弹头的特殊运载导弹从指定发射飞向预定目标，对指定目标造成大范围伤害并对当地造成崩坏污染。"
raid_category_header_BH3_Honkai_Fission_Bomb_Raids:0 "§R崩坏裂变弹打击§!"
raid_category_BH3_Honkai_Fission_Bomb_Raids:0 "§R崩坏裂变弹打击§!"
raid_type_BH3_Honkai_Fission_Bomb_strike:0 "§R崩坏裂变弹打击§!"

BH3_Honkai_Fission_Bomb_strike_threat_tt:0 "崩坏裂变弹打击造成全球崩坏能浓度攀升"
BH3_Honkai_Fission_Bomb_strike_failure_tt:0 "崩坏裂变弹打击失败\n\n崩坏裂变弹打击被敌人拦截了。\n\n"
BH3_Honkai_Fission_Bomb_strike_limit_success_tt:0 "崩坏裂变弹打击成功\n\n该区域化为焦土，崩坏能辐射弥漫，生命绝迹。\n\n"
BH3_Honkai_Fission_Bomb_strike_success_tt:0 "崩坏裂变弹打击成功\n\n该区域化为焦土，崩坏能浓度攀升，生命绝迹。\n\n"

