BH3_Character_event.41.t:0 "「彼岸双生」的觉醒"
BH3_Character_event.41.d:0 "年幼的希儿总觉得自己被“影子”跟随。那个声音在噩梦中低语，在危机时咆哮。直到崩坏的实验将她推入深渊，另一个她终于撕开伪装的平静，从希儿的恐惧与压抑中诞生——懦弱的你，只会哭泣。而我，会撕碎所有威胁。"
BH3_Character_event.41.a1:0 "出来吧，另一个我！"
BH3_Character_event.41.a1d:0 "另一个希儿成为陆军将领"
BH3_Character_event.41.a2:0 "拜托了，另一个我！"
BH3_Character_event.41.a2d:0 "获得特质§R「彼岸双生」§!"
