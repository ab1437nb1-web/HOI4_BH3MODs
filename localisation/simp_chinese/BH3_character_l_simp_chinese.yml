BH3_Character_event.1.t:0 "§R[?BH3_Character_event_1_target.GetName]§!在月球之战中阵亡"
BH3_Character_event.1.d:0 "终焉律者的攻击穿透了她的身躯，装甲早已支离破碎，鲜血从每一道裂痕中渗出，在月尘上凝结成暗红色的冰晶，她的视线已经模糊，但她仍能看到地球在远处静静悬挂，蔚蓝而脆弱。"
BH3_Character_event.1.a:0 "......."
