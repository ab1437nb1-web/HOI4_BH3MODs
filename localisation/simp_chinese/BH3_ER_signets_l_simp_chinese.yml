 BH3_ER_ult_dlv:0 "发动必杀技（救世）"
 BH3_ER_ult_dlv_desc:0 "消耗 50 政治点（代表能量），让已获得的「救世」刻印在窗口内生效：默认 7 天，拥有「救世者的余响」则 9 天。冷却 30 天。"
