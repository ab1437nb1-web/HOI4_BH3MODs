l_simp_chinese:
 BH3_ER_signet_group:0 "往事乐土 · 刻印"
 BH3_ER_signet_none:0 "—"
 BH3_ER_ult_dlv:0 "发动必杀技（救世）"
 BH3_ER_ult_dlv_desc:0 "消耗 50 政治点（代表能量），让已获得的「救世」刻印在窗口内生效：默认 7 天，拥有「救世者的余响」则 9 天。冷却 30 天。"
 BH3_ER_dlv_war_state:0 "救世之战：常驻化（核心Ⅱ）"
 BH3_ER_dlv_war_state_desc:0 "累计释放 40 次必杀技后解锁：把所有已拥有「救世」刻印的加成变为常驻（之后不再需要开大）。"
 BH3_ER_dbg_grant_dlv:0 "【调试】获得全部救世刻印"
 BH3_ER_dbg_grant_dlv_desc:0 "仅调试模式：设置 14 枚救世刻印的持有标记。"
 BH3_ER_dbg_clear_dlv:0 "【调试】清空救世刻印与窗口"
 BH3_ER_dbg_clear_dlv_desc:0 "仅调试模式：清掉全部持有标记、窗口、计数与常驻状态。"
 BH3_ER_dbg_ult:0 "【调试】立即发动一次必杀技"
 BH3_ER_dbg_ult_desc:0 "仅调试模式：调用必杀技窗口效果并累计一次释放。"
 BH3_ER_dbg_ult40:0 "【调试】必杀技计数设为 40"
 BH3_ER_dbg_ult40_desc:0 "仅调试模式：让核心Ⅱ决议立刻解锁。"
 BH3_ER_dbg_window_info:0 "【调试】再触发一次窗口"
 BH3_ER_dbg_window_info_desc:0 "仅调试模式：等同于再放一次大招。"
