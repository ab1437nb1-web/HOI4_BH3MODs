l_simp_chinese:
#研究律者提示
BH3_tech.3.t:0 "崩坏能浓度警告"
BH3_tech.3.d:0 "舰长，侦测到目前崩坏能浓度已经达到§R[?global.BH3_Threat]§!§CHW§!，我们可以研究为“律者”的生物了。"
BH3_tech.3.a:0 "OK"

#崩坏事件
BHS.10.t:0 "神之键受崩坏影响"
BHS.10.d:0 "我们的研究人员报告了一个紧急情况，崩坏大爆发导致崩坏能浓度大幅波动，我们持有的所有神之键出现了一些问题，§R第零额定功率无法激活§!"
BHS.10.a:0 "多久能修好？"

BHS.11.t:0 "崩坏能浓度预警"
BHS.11.d:0 "§R[?global.BHSLandingCountry.GetName]§!位于§R[?global.BHSLandingPoint.GetName]§!的监测机构报告，此地的崩坏能浓度大幅攀升，会有爆发崩坏灾害的风险。"
BHS.11.a:0 "预计在§R[?global.BHS_Landing_Left_Day]天§!左右达到临界，我们需要提前做好准备"

BHS.12.t:0 "崩坏爆发"
BHS.12.d:0 "随着崩坏能浓度飙升到警戒线，§R[?global.BHSLandingCountry.GetName]§!的§R[?global.BHSLandingPoint.GetName]§!爆发了崩坏灾害"
BHS.12.a:0 "所有人都需要行动起来"

BHS.13.t:0 "崩坏兽§R高等活性§!"
BHS.13.d:0 "前线部队报告称崩坏兽近期非常活跃"
BHS.13.a:0 "做好防御的准备！"

BHS.14.t:0 "崩坏兽§R中等活性§!"
BHS.14.d:0 "前线部队报告称崩坏兽近期较为活跃"
BHS.14.a:0 "它们平时不都这样吗？"

BHS.15.t:0 "崩坏兽§R低等活性§!"
BHS.15.d:0 "前线部队报告称崩坏兽近期活动频率大幅下降"
BHS.15.a:0 "反击的时候到了！"

BHS.21.t:0 "崩坏进入§R阶段II§!"
BHS.21.d:0 "来自监测站的最新监测报告，崩坏已经进一步增强。根据以往监测数据比对，现在崩坏处于§R阶段II§!。"
BHS.21.a:0 "提高警惕。"
BHS.22.t:0 "崩坏进入§R阶段III§!"
BHS.22.d:0 "来自监测站的最新监测报告，崩坏已经进一步增强。根据以往监测数据比对，现在崩坏处于§R阶段III§!。"
BHS.22.a:0 "让前线部队做好应对"
BHS.23.t:0 "崩坏进入§R阶段IV§!"
BHS.23.d:0 "来自监测站的最新监测报告，崩坏已经进一步增强。根据以往监测数据比对，现在崩坏处于§R阶段IV§!。"
BHS.23.a:0 "可恶"
BHS.24.t:0 "崩坏进入§R阶段V§!"
BHS.24.d:0 "来自监测站的最新监测报告，崩坏已经进一步增强。根据以往监测数据比对，现在崩坏处于§R阶段V§!。"
BHS.24.a:0 "会赢嘛？"

BHS.25.t:0 "「核冬警报：崩坏兽获得§R核熔蚀抗性§!」"
BHS.25.d:0 "为了应对不断增强的崩坏，人类对崩坏动用了核武器,虽然消灭大量崩坏兽，但促使崩坏兽在基因层面急速进化，衍生出针对核爆能量与辐射的§R核熔蚀抗性§!，这是崩坏意志对文明武器的“针对性进化”，人类越依赖毁灭性武器，崩坏兽的适应越致命。"
BHS.25.a:0 "潘多拉魔盒已经打开了"

HerrscherCome.101.t:0 "理之律者权能提示"
HerrscherCome.101.d:0 "1.每周减1%的研究、生产、建造速度；\n2.每个月扣除所有人类国家1个科研槽位，剩1个科研槽不会再扣"
HerrscherCome.101.a:0 "尽快消灭她"
HerrscherCome.201.t:0 "空之律者权能提示"
HerrscherCome.201.d:0 "空之律者运用权能将陨石从地外推向地球，随机某个国家的三个省份的建筑和军队造成伤害"
HerrscherCome.201.a:0 "尽快消灭她"
HerrscherCome.203.t:0 "天穹流星"
HerrscherCome.203.d:0 "空之律者运用权能将陨石从地外推向地球，对§R[?global.BH3_BHS_Invasion_HI2_hit_country.GetName]的[?global.BH3_BHS_Invasion_HI2_hit_pos1.GetName]、[?global.BH3_BHS_Invasion_HI2_hit_pos2.GetName]、[?global.BH3_BHS_Invasion_HI2_hit_pos3.GetName]§!建筑和军队造成伤害。"
HerrscherCome.203.a:0 "尽快消灭她"
HerrscherCome.203.b:0 "隐藏该事件"
HerrscherCome.301.t:0 "雷之律者权能提示"
HerrscherCome.301.d:0 "无额外机制，雷之律者权能中进攻数值随随时间增强"
HerrscherCome.301.a:0 "尽快消灭她"

HerrscherCome.601.t:0 "死之律者权能提示"
HerrscherCome.601.d:0 "每50天随机对任一交战国家发动一次死亡凋零，挂上debuff同时对任意2个地块挂省份崩坏debuff"
HerrscherCome.601.a:0 "尽快消灭她"
HerrscherCome.604.t:0 "死亡凋零"
HerrscherCome.604.d:0 "死之律者对§R[?global.BH3_BHS_Invasion_HI6_hit_country.GetName]发动了一次死亡凋零，该国将受到死亡凋零民族精神debuff，同时该国的[?global.BH3_BHS_Invasion_HI6_hit_pos1.GetName]、[?global.BH3_BHS_Invasion_HI6_hit_pos2.GetName]§!受到崩坏侵蚀§"
HerrscherCome.604.a:0 "尽快消灭她"
HerrscherCome.604.b:0 "隐藏该事件"
HerrscherCome.701.t:0 "炎之律者权能提示"
HerrscherCome.701.d:0 "每20天有25%的概率获得7天攻击加强效果"
HerrscherCome.701.a:0 "尽快消灭她"
HerrscherCome.704.t:0 "天火圣裁"
HerrscherCome.704.d:0 "炎之律者权能解放，获得7天攻击加强效果"
HerrscherCome.704.a:0 "尽快消灭她"
HerrscherCome.704.b:0 "隐藏该事件"
HerrscherCome.1201.t:0 "侵蚀之律者权能提示"
HerrscherCome.1201.d:0 "1.侵蚀之律者每20天随机对一个玩家发动侵蚀权能，遮挡玩家操作界面（不影响操作，但会有视觉遮挡）；\n2.侵蚀律者诞生后，为崩坏和侵蚀律者创建情报机构。"
HerrscherCome.1201.a:0 "尽快消灭她"
HerrscherCome.1204.t:0 "系统浸染"
HerrscherCome.1204.d:0 "§R[?global.BH3_BHS_Invasion_HH2_hit_country.GetName]的钢铁雄心4被侵蚀之律者攻击了！"
HerrscherCome.1204.a:0 "尽快消灭她"
HerrscherCome.1204.b:0 "隐藏该事件"

#超事件
BH3_BHS_invasion_start_event_desc:0 "崩坏是一种自然现象，它拥有自我意识，并反抗“文明”的发展。其核心是一种在单一时空中不服从质能守恒定律的能量形式，被称为“崩坏能”。崩坏与人类的文明发展相对立，随着人类科技文明的进步，崩坏灾难的等级也会逐渐升高。在崩坏灾难进行时，会诞生各种各样的自然灾害，给人类带来严重的威胁。崩坏灾难中还会诞生律者，他们的使命是结束人类文明。这些律者具有强大的力量和技能，是人类对抗崩坏的主要敌人。\n在§R[?global.BHS_StartLocation.GetName]§!爆发了严重的大崩坏灾害"
BH3_BHS_invasion_start_event_btn_tt:0 "黑暗的时代"
BH3_BHS_Invasion_Event_title_HI1_Come:0 "理之律者诞生"
BH3_BHS_Invasion_Event_HI1_Come_desc:0 "虽然我们采取了积极的行动，但理之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HI1_Come_btn_t:0 "必须尽快击败她"
BH3_BHS_Invasion_Event_title_HI2_Come:0 "空之律者诞生"
BH3_BHS_Invasion_Event_HI2_Come_desc:0 "虽然我们采取了积极的行动，但空之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HI2_Come_btn_t:0 "做好下次进攻的准备"
BH3_BHS_Invasion_Event_title_HI3_Come:0 "雷之律者诞生"
BH3_BHS_Invasion_Event_HI3_Come_desc:0 "虽然我们采取了积极的行动，但雷之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HI3_Come_btn_t:0 "我们还有机会击败她"

BH3_BHS_Invasion_Event_title_HI6_Come:0 "死之律者诞生"
BH3_BHS_Invasion_Event_HI6_Come_desc:0 "虽然我们采取了积极的行动，但死之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HI6_Come_btn_t:0 "我们不惧死亡"
BH3_BHS_Invasion_Event_title_HI7_Come:0 "炎之律者诞生"
BH3_BHS_Invasion_Event_HI7_Come_desc:0 "虽然我们采取了积极的行动，但炎之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HI7_Come_btn_t:0 "立即组织防守"
BH3_BHS_Invasion_Event_title_HH2_Come:0 "侵蚀之律者诞生"
BH3_BHS_Invasion_Event_HH2_Come_desc:0 "虽然我们采取了积极的行动，但侵蚀之律者仍然在§R[?global.BHSLandingPoint.GetName]§!诞生。"
BH3_BHS_Invasion_Event_HH2_Come_btn_t:0 "嗨，想我了吗？"

BH3_BHS_Invasion_Event_title_HI1_Beaten:0 "理之律者被消灭"
BH3_BHS_Invasion_Event_HI1_Beaten_desc:0 "§R[?global.Who_beat_HI1.GetName]§!击败了理之律者，律者核心也被§R[?global.Who_beat_HI1.GetName]§!回收。"
BH3_BHS_Invasion_Event_HI1_Beaten_btn_t:0 "绝境中的曙光！"
BH3_BHS_Invasion_Event_title_HI2_Beaten:0 "空之律者被消灭"
BH3_BHS_Invasion_Event_HI2_Beaten_desc:0 "§R[?global.Who_beat_HI2.GetName]§!击败了空之律者，律者核心也被§R[?global.Who_beat_HI2.GetName]§!回收。"
BH3_BHS_Invasion_Event_HI2_Beaten_btn_t:0 "干得漂亮！"
BH3_BHS_Invasion_Event_title_HI3_Beaten:0 "雷之律者被消灭"
BH3_BHS_Invasion_Event_HI3_Beaten_desc:0 "§R[?global.Who_beat_HI3.GetName]§!击败了雷之律者，律者核心也被§R[?global.Who_beat_HI3.GetName]§!回收。"
BH3_BHS_Invasion_Event_HI3_Beaten_btn_t:0 "离胜利又近了一步！"

BH3_BHS_Invasion_Event_title_HI6_Beaten:0 "死之律者被消灭"
BH3_BHS_Invasion_Event_HI6_Beaten_desc:0 "§R[?global.Who_beat_HI6.GetName]§!击败了死之律者，律者核心也被§R[?global.Who_beat_HI6.GetName]§!回收。"
BH3_BHS_Invasion_Event_HI6_Beaten_btn_t:0 "继续前进！"
BH3_BHS_Invasion_Event_title_HI7_Beaten:0 "炎之律者被消灭"
BH3_BHS_Invasion_Event_HI7_Beaten_desc:0 "§R[?global.Who_beat_HI7.GetName]§!击败了炎之律者，律者核心也被§R[?global.Who_beat_HI7.GetName]§!回收。"
BH3_BHS_Invasion_Event_HI7_Beaten_btn_t:0 "下一个会是什么律者？"
BH3_BHS_Invasion_Event_title_HH2_Beaten:0 "侵蚀之律者被消灭"
BH3_BHS_Invasion_Event_HH2_Beaten_desc:0 "§R[?global.Who_beat_HH2.GetName]§!击败了侵蚀之律者，律者核心也被§R[?global.Who_beat_HH2.GetName]§!回收。"
BH3_BHS_Invasion_Event_HH2_Beaten_btn_t:0 "拙劣的模仿者！"

BH3_BHS_Invasion_Event_title_HI1_Reward:0 "「真」"
BH3_BHS_Invasion_Event_HI1_Reward_desc:0 "斩「都牟刈神」所铸，可令凡人遍观法理，解构万象再造神迹\n（§R[?global.Who_beat_HI1.GetName]§!获得理之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HI1_Reward_btn_t:0 "好"
BH3_BHS_Invasion_Event_title_HI2_Reward:0 "「天」"
BH3_BHS_Invasion_Event_HI2_Reward_desc:0 "斩「天常立尊」所铸，可令高天变作墙垣，祸津众神穿行维艰\n（§R[?global.Who_beat_HI2.GetName]§!获得空之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HI2_Reward_btn_t:0 "好"
BH3_BHS_Invasion_Event_title_HI3_Reward:0 "「鸣」"
BH3_BHS_Invasion_Event_HI3_Reward_desc:0 "斩「建御雷神」所铸，可令雷光撕裂长空，星流霆击施罚天刑\n（§R[?global.Who_beat_HI3.GetName]§!获得雷之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HI3_Reward_btn_t:0 "好"
BH3_BHS_Invasion_Event_title_HI6_Reward:0 "「命」"
BH3_BHS_Invasion_Event_HI6_Reward_desc:0 "斩「石长比卖」所铸，可令荒冢遍开花丛，生生死死流转无踪\n（§R[?global.Who_beat_HI6.GetName]§!获得死之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HI6_Reward_btn_t:0 "好"
BH3_BHS_Invasion_Event_title_HI7_Reward:0 "「烈」"
BH3_BHS_Invasion_Event_HI7_Reward_desc:0 "斩「迦具土命」所铸，可令炽火燃烧尘寰，赫赫炎炎烛天燎原\n（§R[?global.Who_beat_HI7.GetName]§!获得炎之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HI7_Reward_btn_t:0 "好"
BH3_BHS_Invasion_Event_title_HH2_Reward:0 "「喰」"
BH3_BHS_Invasion_Event_HH2_Reward_desc:0 "斩「八十枉津」所铸，可令常世剥蚀朽坏，神鬼难辨四魂两拆\n（§R[?global.Who_beat_HH2.GetName]§!获得侵蚀之律者权能，以及政治点数£GFX_pol_idea500和陆军经验£GFX_army_experience350）"
BH3_BHS_Invasion_Event_HH2_Reward_btn_t:0 "好"

BH3_BHS_Invasion_Event_title_MoonBattleStart1:0 "胜利曙光"
BH3_BHS_Invasion_Event_MoonBattleStart_desc1:0 "人类联军已击溃多轮崩坏爆发，收复大片沦陷区。然而，真正的终结之战仍在月球——唯有主动迎击终焉律者，才能彻底斩断崩坏的根源。\n\n§R（因崩坏投降倾向过高，即将触发月球之战，将根据SSS级女武神数量和女武神总战力决定月球之战结局。）§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t1:0 "直指月球！"
BH3_BHS_Invasion_Event_title_MoonBattleStart2:0 "胜利曙光"
BH3_BHS_Invasion_Event_MoonBattleStart_desc2:0 "人类击败了所有律者，然而，真正的胜利尚未到来——我们必须在终焉律者完全觉醒前将其消灭，才能为文明画上真正的句点。\n\n§R（因击败了所有律者，即将触发月球之战，将根据SSS级女武神数量和女武神总战力决定月球之战结局。）§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t2:0 "蛐蛐律者"
BH3_BHS_Invasion_Event_title_MoonBattleStart3:0 "文明余烬"
BH3_BHS_Invasion_Event_MoonBattleStart_desc3:0 "崩坏侵蚀已吞噬全世界崩坏已夺走§R[?global.HonkaiImpact_Cause_Population_Casualty]§!百万人，占总人口的§R[?global.HonkaiImpact_Cause_Population_Casualty_p]%§!。人类军队在各大陆防线相继瓦解，残存部队已无法组织有效抵抗。人类文明的灯火在风中摇曳。月球上的终焉律者虽是最后可能的机会，但地球已凑不出一支完整的。\n\n§R（因人类人口损失超过70%直接触发月球之战失败结局）§!"
BH3_BHS_Invasion_Event_MoonBattleStart_btn_t3:0 "毫无希望"

BH3_BHS_Invasion_Event_title_MoonBattleWin:0 "终焉一击＆月球之战"
BH3_BHS_Invasion_Event_MoonBattleWin_desc:0 "终焉律者诞生了，从地外发动毁灭性的一击，对地球造成大范围的崩坏灾害。人类的勇士们乘坐飞行器赶赴月球与终焉律者展开最后的决战。\n终焉律者的身躯在月面崩解，化作无数光尘消散于虚空，最后的考验，终焉之茧就在眼前。但终焉律者对地球的一击诞生了新的崩坏兽，如果我们不能按时§R进入终焉之茧§!，人类文明仍将被重启。"
BH3_BHS_Invasion_Event_MoonBattleWin_btn_t:0 "胜利就在眼前"
BH3_BHS_Invasion_Event_title_MoonBattleLose:0 "终焉一击＆月球之战"
BH3_BHS_Invasion_Event_MoonBattleLose_desc:0 "终焉律者诞生了，从地外发动毁灭性的一击，城市在顷刻间化为废墟。人类的勇士们集结最后的战力，乘上仅存的飞行器奔赴月球\n在绝望之战月面战场，终焉律者俯瞰众生，她的力量远超预期，每一次攻击都撕裂空间，每一道目光都冻结灵魂。§R“你们……终究只是蝼蚁。”§!崩坏拒绝给予§R“考验”§!的资格。§R“文明不合格，轮回继续。”§!"
BH3_BHS_Invasion_Event_MoonBattleLose_btn_t:0 "人世已尽,天命难违"
BH3_BHS_Invasion_Event_title_EnterHive:0 "进入终焉之茧"
BH3_BHS_Invasion_Event_EnterHive_desc:0 "终焉之茧是由外星文明制造出来的物体，拥有操控命运的能力，轮回其他星球的文明，在降落之前，它早已拜访过太阳系的其他行星，地球则是最后一站。或许是因为终焉与人类之间相差了太多维度，导致这种「拥抱」总是充满错误，所以终焉用一次次试错来为这种「拥抱」求得「正确的答案」————轮回星球，清除文明，将一切重置回最初。"
BH3_BHS_Invasion_Event_EnterHive_btn_t:0 "将崩坏全部驱逐出去"
BH3_BHS_invasion_end_event_title_desc:0 "跨越终焉"
BH3_BHS_invasion_end_event_desc:0 "自[?global.BHS_month_counts|R0]月前那场前所未有的崩坏灾害席卷全球以来，人类世界仿佛一夜之间陷入了风雨飘摇的绝境之中。截止[GetDate]，[?global.HonkaiImpact_Beat_Country_Num|R0]个国家不复存在，多达[?global.HonkaiImpact_Cause_Population_Casualty|R0]百万人被崩坏吞噬于无尽的黑暗之中，人类总人口减少到[?global.HonkaiImpact_Remain_Population_Casualty|R0]百万人。\n然而，正是在人类危急存亡之际，我们这个种族展现出了前所未有不屈精神。[?global.HonkaiImpact_Cause_Casualty|R0]万英勇无畏的战士挺身而出，他们如同璀璨星辰般在黑暗中闪耀，用生命与热血筑起了捍卫人类尊严与希望的长城。\n在这场规模空前的抗争中，我们汇聚起无尽的智慧与力量，通过科技、策略与勇气，成功消灭了[?global.HonkaiImpact_Casualty|R0]万只崩坏兽，这一数字背后，是无数次生死较量、无数汗水与泪水的交织。在经历了无尽的苦难与奋斗之后，人类跨越了终焉的绝境，最终迎来了新生与希望。"
BH3_BHS_invasion_end_event_btn_tt:0 "所有人都是英雄！"

#新闻
BHS_news.1.t1:0 "崩坏覆灭了[?global.bhs_beat_country.GetName]"
BHS_news.1.d1:0 "在崩坏的狂澜之下，[?global.bhs_beat_country.GetName]已然不复存在。昔日的繁华都市，如今化作了一片废墟，断壁残垣间弥漫着死亡的气息。街道上空无一人，只有风在呼啸，卷起尘埃，仿佛在低语着过往的辉煌与现在的苍凉。\n在这片废墟中，家破人亡的景象更是令人痛心。破碎的门窗后，是散落的家具和家人的遗物，仿佛在诉说着曾经的温馨与现在的凄凉。孩子们的笑声、夫妻的争吵、老人的叮嘱，这些曾经熟悉的声音，如今都已被沉默所取代。\n在这片死寂中，偶尔还能见到一些幸存者在废墟中徘徊，他们眼中充满了绝望与无助。他们失去了亲人，失去了家园，甚至失去了对未来的希望。他们的心中充满了痛苦和悔恨，但在这崩坏的世界中，他们只能默默承受，无力回天。"
BHS_news.1.a:0 "我们无能为力"
BHS_news.1.t2:0 "崩坏肆虐[?global.bhs_beat_country.GetName]"
BHS_news.1.d2:0 "[?global.bhs_beat_country.GetName]遭受了前所未有的崩坏灾难。曾经繁华的城市在崩坏能量的肆虐下化为废墟，高楼大厦崩塌成一片残垣断壁，街道上遍布着崩坏兽的残骸和烧焦的痕迹。空气中弥漫着焦土与尘埃的气息，乌云密布的天空下，整个城市都笼罩在一片灰暗与绝望之中。\n城市的灯火已经熄灭，曾经的热闹与喧嚣荡然无存，只剩下寂静与死寂。人们的家园被崩坏摧毁，曾经的欢声笑语、温暖拥抱，都在这一刻化为乌有。街道上，散落着被崩坏兽撕碎的衣物和遗落的物品，无声地诉说着曾经的温馨与美好。\n幸存者们面色苍白，眼中满是惊恐与无助。他们失去了亲人，失去了家园，也失去了对未来的希望。在这片被崩坏毁灭的土地上，人们的内心充满了无尽的悲痛与绝望。整个国家，仿佛陷入了一场无法醒来的噩梦，被崩坏的力量无情地吞噬。"
BHS_news.1.a:0 "我们无能为力"
BHS_news.1.t3:0 "[?global.bhs_beat_country.GetName]的军队还在坚守"
BHS_news.1.d3:0 "崩坏在[?global.bhs_beat_country.GetName]爆发，毁灭了这的一切。曾经辉煌的城市如今已是满目疮痍，废墟遍地，街道断裂，高楼坍塌，空气中弥漫着浓厚的尘埃与硝烟。天空被厚重的黑暗笼罩，仿佛永无光明之日。\n军队们仍在奋力抵抗，但面对崩坏兽潮水般的进攻，他们渐渐感到力不从心。身上的装备已斑驳不堪，手中的武器愈发沉重。每一次挥剑，每一次射击，都消耗着他们仅剩的体力与意志。该国的军队虽然仍活跃在各个战场，但面对数量庞大的崩坏兽，她们也感到了前所未有的压力。\n这片土地上的生机正在逐渐消逝，军队们的抵抗也快要支撑不住了。但他们依然坚守阵地，用最后的力量捍卫着这片土地。他们的眼神中透露出坚定与不屈，即使知道前路艰难，也绝不会轻易放弃。因为他们知道，只要还有一丝希望，就必须坚持到底。"
BHS_news.1.a:0 "我们无能为力"
BHS_news.1.t4:0 "我们与[?global.bhs_beat_country.GetName]失去了所有联系"
BHS_news.1.d4:0 "[?global.bhs_beat_country.GetName]遭受了毁灭性的打击，已经彻底失去了与外界的所有联系。曾经繁华的城市如今已是一片废墟，高楼大厦在崩坏能的肆虐下化为残垣断壁，街道被崩坏兽的利爪撕裂得支离破碎。空气中弥漫着尘埃与硝烟，天空被黑暗笼罩，阳光无法穿透那厚重的云层。\n在这片废墟之上，幸存者们四处奔逃，寻找着生还的亲人，但更多的是绝望的呐喊和无助的哭泣。他们试图与外界取得联系，但所有的通信设备都已失效，信号被崩坏能干扰得无法传递。他们被困在这片荒芜的土地上，与外界隔绝，孤立无援。\n这个国家仿佛被世界遗忘。没有人知道他们正经历着怎样的苦难与挣扎，也没有人能够伸出援手。幸存者们只能依靠自己的力量，在这片废墟上艰难求生。他们面临着崩坏兽的威胁、资源的匮乏以及无尽的孤独与恐惧。"
BHS_news.1.a:0 "我们无能为力"