# ===== 往事乐土 P3 真我刻印 =====
BH3_ER_Elysia_GER:0 "真我·日耳曼尼亚"
BH3_ER_Elysia_GER_desc:0 "德国的定制刻印。核心机制「闪击节奏」：每完成一个阶段任务都会累积节奏值，节奏越高，进攻与生产加成越强。若能在历史节点（1938 年 3 月德奥合并 / 1939 年 9 月波兰战役 / 1941 年 6 月巴巴罗萨）之前完成，还会额外获得节奏——拖得越久，越难补回来。"
BH3_ER_Elysia_SOV:0 "真我·苏维埃"
BH3_ER_Elysia_SOV_desc:0 "苏联的定制刻印。核心机制「纵深」：丢失的核心领土越多，防御、损耗减免与补员越强；收复失地后再获得「解放」加成，越打越强。"
BH3_ER_Elysia_GER_1a:0 "重整军备·四年计划"
BH3_ER_Elysia_GER_1a_desc:0 "走扩军备战路线：完成「四年计划」国策。军工产能强，但消费品负担重。"
BH3_ER_Elysia_GER_1b:0 "重整军备·恢复经济"
BH3_ER_Elysia_GER_1b_desc:0 "取消梅福券体系，走「经济增长优先」路线。消费品轻、经济增长快，但军工起步较慢。"
BH3_ER_Elysia_GER_1c:0 "重整军备·闪电扩军"
BH3_ER_Elysia_GER_1c_desc:0 "不碰经济路线，直接扩军：陆军人力达到 100 万。"
BH3_ER_Elysia_GER_2a:0 "不流血的外交·慕尼黑路线"
BH3_ER_Elysia_GER_2a_desc:0 "以外交手段扩张：完成「索取苏台德」国策。"
BH3_ER_Elysia_GER_2b:0 "不流血的外交·直接摊牌"
BH3_ER_Elysia_GER_2b_desc:0 "直接动武：使波兰投降。"
BH3_ER_Elysia_GER_3a:0 "西线还是东线·海狮计划"
BH3_ER_Elysia_GER_3a_desc:0 "登陆并击溃英国。"
BH3_ER_Elysia_GER_3b:0 "西线还是东线·巴巴罗萨"
BH3_ER_Elysia_GER_3b_desc:0 "击溃苏联。"
BH3_ER_Elysia_SOV_1a:0 "重回稳定·结束清洗（左倾）"
BH3_ER_Elysia_SOV_1a_desc:0 "沿左倾路线收束大清洗。注意：该路线国策链的硬性下限约 910 天（清洗国策各带 175 天强制间隔，本体与前置另计）。"
BH3_ER_Elysia_SOV_1b:0 "重回稳定·结束清洗（右倾）"
BH3_ER_Elysia_SOV_1b_desc:0 "沿右倾路线收束大清洗。同样是含 175 天强制间隔的长链，硬性下限约 910 天。"
BH3_ER_Elysia_SOV_1c:0 "重回稳定·军队重建"
BH3_ER_Elysia_SOV_1c_desc:0 "不走清洗路线，改为重建被清洗的军官团：陆军人力达到 150 万。"
BH3_ER_Elysia_SOV_2a:0 "五年计划·完成计划"
BH3_ER_Elysia_SOV_2a_desc:0 "完成五年计划国策，把工业基础铺开。"
BH3_ER_Elysia_SOV_2b:0 "五年计划·工业东迁"
BH3_ER_Elysia_SOV_2b_desc:0 "把工业迁往乌拉尔以东，为最坏情况做准备。"
BH3_ER_Elysia_SOV_2c:0 "五年计划·筑垒地带"
BH3_ER_Elysia_SOV_2c_desc:0 "沿西部边境修筑斯大林防线。"
BH3_ER_Elysia_SOV_3a:0 "抗住进攻·坚守核心"
BH3_ER_Elysia_SOV_3a_desc:0 "与德国开战，且投降进度保持在 30% 以下——撑住，别崩。"
BH3_ER_Elysia_SOV_3b:0 "抗住进攻·反攻柏林"
BH3_ER_Elysia_SOV_3b_desc:0 "反攻到底：使德国投降。"
