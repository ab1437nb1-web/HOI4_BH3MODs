BH3_ER_Bodhi_TrapProposal:0 "陷阱提案"
BH3_ER_Bodhi_TrapProposal_desc:0 "§Y天慧§!的主动手段：被我们策反的将领在目标国情报网的协同下提出一份新提案——看似拨款给后勤，实则将资金转入地下情报网。成功后目标国将在 120 天内计划速度 −30%、陆军攻击 −15%、每周战争支持度 −0.05%。需持有天慧核心刻印、已建立情报机构，且目标国存在我方情报网。"
