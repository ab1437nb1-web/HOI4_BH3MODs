BH3_ER_gui_draw:0 "进入试炼·刻印三选一"
BH3_ER_gui_draw_tt:0 "消耗 §Y50 把无瑕之钥§!，开启一次与原作相同的刻印三选一：\n随机出现三§Y位英桀的传送门§!，每位门内是其§Y下一枚刻印§!（普通 Ⅰ→Ⅱ→Ⅲ → 核心 → 增幅，同系自动递进，与原作重复获得即升级一致）。\n\n规则（与原作一致）：\n· 未集齐 3 枚普通刻印的系 → 门内给下一枚普通刻印；\n· 集齐 3 枚普通后 → 门内变为该系§Y核心刻印§!；\n· 持有核心后 → 门内变为该系§Y增幅刻印§!；\n· 三候选互不重复；候选不足时可放弃并全额返还钥匙。\n\n点选一张候选卡即获得对应刻印；点击候选卡可查看其完整名称与效果说明。"
BH3_ER_gui_cancel:0 "放弃本次（返还钥匙）"
BH3_ER_gui_cancel_tt:0 "放弃当前的三候选，§Y全额返还 50 把无瑕之钥§!。"
BH3_ER_gui_reset:0 "重置全部刻印"
BH3_ER_gui_reset_tt:0 "移除全部已持有刻印（含动态修正），返还 §Y25 把无瑕之钥§!（约为总投入的半数）。"
