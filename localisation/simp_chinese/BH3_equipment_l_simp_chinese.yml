HerrscherVoid_Kiana_equipment:0 "律者核心-琪亚娜"
HerrscherVoid_Kiana_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherVoid_Kiana_equipment_0:0 "空之律者"
HerrscherVoid_Kiana_equipment_0_desc:0 "§R空之律者§!\nK423是唯一成功存活的律者复制体，她的体内混入了天命计划中的最强战士，齐格飞与塞西莉亚之女琪亚娜的基因。她将成为律者再次降生的宿体，并帮助天命掌控律者的力量。在经历了十几年辗转波折之后，空之律者，最终再临于世。\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherFlamescion_Kiana_equipment:0 "律者核心(薪炎)-琪亚娜"
HerrscherFlamescion_Kiana_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherFlamescion_Kiana_equipment_0:0 "薪炎之律者"
HerrscherFlamescion_Kiana_equipment_0_desc:0 "§R薪炎之律者§!\n在支配剧场挥出最后那一击时，手中的大剑仿佛感受到了旁人的希冀，剑身凝结出一道道光芒，将同伴们的力量传递，将汇聚于她身上的希望燃起。少女没有回头，但她知道，自己身后是许多人注视的目光、是同伴们传递给自己前行的力量、是黑夜中永燃不熄的薪火。\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherThunder_Mei_equipment:0 "律者核心-芽衣"
HerrscherThunder_Mei_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherThunder_Mei_equipment_0:0 "雷之律者"
HerrscherThunder_Mei_equipment_0_desc:0 "§R雷之律者§!\n雷电芽衣将长空市残留的崩坏能尽数吸收后解放的力量，是她完全以自身意志觉醒而成的律者姿态。凛若鬼神的样貌昭示着征服的权柄已被她握在手中，这一刻，世界迎来了雷电女王的归来。\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherReason_Bronya_equipment:0 "律者核心-布洛妮娅"
HerrscherReason_Bronya_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherReason_Bronya_equipment_0:0 "理之律者"
HerrscherReason_Bronya_equipment_0_desc:0 "§R理之律者§!\n布洛妮娅在量子之海中与理之律者的核心融合而成的姿态，亦是瓦尔特·杨对其认可的证明。在这个形态下，重装小兔和布洛妮娅本人的样子都朝着“她理想中的样子”产生了一些变化。\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherRebirth_Seele_equipment:0 "律者核心-希儿"
HerrscherRebirth_Seele_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherRebirth_Seele_equipment_0:0 "死生之律者"
HerrscherRebirth_Seele_equipment_0_desc:0 "§R死生之律者§!\n泡沫浮上水面，怒放于金色的晨曦；蝴蝶飞跃深海，栖留在纤柔的指尖。自海中诞生的她，虽将独自前行，但那跨越了死生之境的灵魂，已无惧于悄然滋长的恶芽。海中的魂灵，请聆听生命的旋律！\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherHuman_Elysia_equipment:0 "律者核心-爱莉希雅"
HerrscherHuman_Elysia_equipment_desc:0 "总之一切都可以用崩坏能解释"
HerrscherHuman_Elysia_equipment_0:0 "真我·人之律者核心"
HerrscherHuman_Elysia_equipment_0_desc:0 "§R真我·人之律者§!\n她从星月间落下，于人镌刻网的传说，于点滴中挥喜怒与哀乐，于黑暗前开辟希望间之新章。她是“人性”的律者，她是“人类”的律者。\n\n§Y需要崩坏能浓度达到1000HW以上\n当前崩坏能浓度：§R[?global.BH3_Threat]§!§CHW§!\n崩坏入侵模式下需允许使用律者§!"
HerrscherErosion_Elysia_equipment:0 "律者核心-侵蚀"
HerrscherErosion_Elysia_equipment_desc:0 "总之一切都可以用崩坏能解释"
