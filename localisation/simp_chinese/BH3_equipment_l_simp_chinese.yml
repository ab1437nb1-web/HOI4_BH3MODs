# ===== 往事乐土（由 BH3_ElysianRealm 本地化并入，避免独立文件问题）=====
BH3_FlawlessKey_equipment:0 "无瑕之钥"
BH3_FlawlessKey_equipment_desc:0 "神秘钥匙。在此mod中：由生产界面制造（250 IC），每完成一次「往事乐土」抽取消耗 1 把。"
BH3_FlawlessKey_equipment_0:0 "无瑕之钥"
BH3_sp_ElysianRealm_Open:0 "开启往事乐土"
BH3_sp_ElysianRealm_Open_desc:0 "在记忆体的回响中开启往事乐土：解锁「无瑕之钥」的生产，并开放「往事乐土」决议组，可消耗钥匙抽取十三英桀的刻印。"
BH3_sp_tag_BH3_ElysianRealm:0 "往事乐土"
BH3_ElysianRealm_group:0 "往事乐土"
BH3_ElysianRealm_draw:0 "进入乐土·抽取刻印"
BH3_ElysianRealm_draw_desc:0 "消耗 §Y50 把无瑕之钥§!，从 12 位英桀中随机取得一枚刻印（普通 / 核心 / 增幅）。仅当还有英桀未集齐时可用。"
BH3_ElysianRealm_reset:0 "重置刻印"
BH3_ElysianRealm_reset_desc:0 "清空当前持有的全部刻印（含其动态修正），并返还 25 把「无瑕之钥」（约为单次抽取花费的一半）。"
BH3_ER_Savior_1:0 "救世·Ⅰ 猎杀者的假面"
BH3_ER_Savior_1_desc:0 "§Y救世之铭·凯文§!的第一枚普通刻印。\n§R开战状态下生效§!：陆军攻击 +15%、突破 +18%、空军攻击 +15%。"
BH3_ER_Savior_2:0 "救世·Ⅱ 施予者的金杯"
BH3_ER_Savior_2_desc:0 "第二枚普通刻印。\n§R开战状态下生效§!：陆军攻击 +15%、突破 +18%、空军攻击 +15%。"
BH3_ER_Savior_3:0 "救世·Ⅲ 守望者的坠饰"
BH3_ER_Savior_3_desc:0 "第三枚普通刻印。\n§R开战状态下生效§!：陆军攻击 +15%、突破 +18%、空军攻击 +15%。"
BH3_ER_Savior_Core:0 "救世·核心刻印：救世者的孤影"
BH3_ER_Savior_Core_desc:0 "核心刻印（对应原作「爆发命中 50 次后普通刻印永久生效」）。\n§R开战状态下生效§!：陆军攻击 +25%、突破 +30%、空军攻击 +25%、组织度 +5。"
BH3_ER_Savior_Amp:0 "救世·增幅刻印：救世者的残梦"
BH3_ER_Savior_Amp_desc:0 "增幅刻印（需先有核心；对应原作「救世之战中普通刻印效果 +50%」）。\n§R开战状态下生效§!：陆军攻击 +35%、突破 +40%、空军攻击 +35%、核心省份攻击 +15%、计划速度 +25%。\n§Y满配合计§!：陆军攻击 +105%、突破 +124%、空军攻击 +105%（对标神之键「第零额定功率」档位）。"
BH3_ElysianRealm.1.t:0 "往事乐土·试炼"
BH3_ElysianRealm.1.desc:0 "记忆体的回响在乐土深处汇聚。持有无瑕之钥的你，可以在此取得一位英桀的刻印。\n\n乐土中有§Y12 位英桀§!，各自拥有 3 枚普通刻印、1 枚核心刻印与 1 枚增幅刻印；每次抽取会在「符合条件」的英桀中随机。\n\n每位英桀的刻印各有自己的苏醒条件（开战、情报机构、稳定度、战支、投降进度、战损比、科技数、和平时期等），并非一律为开战——具体见对应刻印的提示。"
BH3_ElysianRealm.1.a:0 "抽取一枚§Y普通刻印§!（随机派系，自动取该派系下一级）"
BH3_ElysianRealm.1.b:0 "抽取一枚§Y核心刻印§!（随机派系，需该派系普通刻印已集齐 3 枚）"
BH3_ElysianRealm.1.c:0 "抽取一枚§Y增幅刻印§!（随机派系，需该派系已有核心刻印）"
BH3_ElysianRealm.1.d:0 "取得核心刻印「救世者的孤影」（需集齐 Ⅰ~Ⅲ）"
BH3_ElysianRealm.1.e:0 "取得增幅刻印「救世者的残梦」（需先有核心）"
BH3_ElysianRealm.1.f:0 "放弃本次（获得 25 政治点）"

