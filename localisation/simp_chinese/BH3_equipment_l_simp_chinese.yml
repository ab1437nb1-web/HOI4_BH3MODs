# ===== 往事乐土 P3：真我刻印（国家定制刻印任务链）=====
BH3_ElysianRealm_elysia_missions:0 "真我刻印"
BH3_ER_Elysia:0 "真我刻印"
BH3_ER_Elysia_desc:0 "「真我」定制刻印：完成本国在往事乐土中的专属任务链后获得的奖励。一经授予，永久保留。"
BH3_ER_Elysia_GER:0 "真我·日耳曼尼亚"
BH3_ER_Elysia_GER_desc:0 "德国的定制刻印。核心机制「闪击节奏」：每完成一个阶段任务都会累积节奏值，节奏越高，进攻与生产加成越强。若能在历史节点（1938 年 3 月德奥合并 / 1939 年 9 月波兰战役 / 1941 年 6 月巴巴罗萨）之前完成，还会额外获得节奏——拖得越久，越难补回来。"
BH3_ER_elysia_delay_dm:0 "往事乐土：拖延的誓约"
BH3_ER_Elysia_GER_momentum_dm:0 "闪击节奏·Ⅰ"
BH3_ER_Elysia_GER_momentum2_dm:0 "闪击节奏·Ⅱ"
BH3_ER_Elysia_GER_momentum3_dm:0 "闪击节奏·Ⅲ"
BH3_ER_Elysia_GER_momentum4_dm:0 "闪击节奏·Ⅳ"
BH3_ER_Elysia_GER_1a:0 "重整军备·经济路线"
BH3_ER_Elysia_GER_1a_desc:0 "走经济路线：完成「四年计划」国策——或其互斥的另一条起点「经济增长优先」。扩军分支军工产能强，但消费品负担重。\n\n§Y第 1/3 阶段§!（时限 801 天）。阶段依次解锁；超时将累积拖延惩罚（至多 5 层），直到完成为止。\n§Y阶段一统一附加要求§!：1938 年 1 月 1 日之后，生活消费品工厂系数不高于 60%。"
BH3_ER_Elysia_GER_1b:0 "重整军备·恢复经济"
BH3_ER_Elysia_GER_1b_desc:0 "取消梅福券体系，走「经济增长优先」路线。消费品轻、经济增长快，但军工起步较慢。\n\n§Y第 1/3 阶段§!（时限 801 天）。阶段依次解锁；超时将累积拖延惩罚（至多 5 层）。\n§Y阶段一统一附加要求§!：1938 年 1 月 1 日之后，生活消费品工厂系数不高于 60%。"
BH3_ER_Elysia_GER_1c:0 "重整军备·闪电扩军"
BH3_ER_Elysia_GER_1c_desc:0 "不碰经济路线，直接扩军：陆军师数超过 70 个。\n\n§Y第 1/3 阶段§!（时限 801 天）。阶段依次解锁；超时将累积拖延惩罚（至多 5 层）。\n§Y阶段一统一附加要求§!：1938 年 1 月 1 日之后，生活消费品工厂系数不高于 60%。"
BH3_ER_Elysia_GER_2a:0 "不流血的外交·慕尼黑路线"
BH3_ER_Elysia_GER_2a_desc:0 "以外交手段扩张：完成「德奥合并」或「索取苏台德」国策。\n\n§Y第 2/3 阶段§!（时限 538 天）。阶段依次解锁；超时将累积拖延惩罚（至多 5 层）。"
BH3_ER_Elysia_GER_2b:0 "不流血的外交·直接摊牌"
BH3_ER_Elysia_GER_2b_desc:0 "直接动武：消灭波兰（若波兰被第三方消灭，同样视为达成）。\n\n§Y第 2/3 阶段§!（时限 538 天）。阶段依次解锁；超时将累积拖延惩罚（至多 5 层）。"
BH3_ER_Elysia_GER_3a:0 "西线还是东线·海狮计划"
BH3_ER_Elysia_GER_3a_desc:0 "登陆并击溃英国。\n\n§Y第 3/3 阶段§!（时限 660 天）。完成后授予真我刻印本体——永久保留。"
BH3_ER_Elysia_GER_3b:0 "西线还是东线·巴巴罗萨"
BH3_ER_Elysia_GER_3b_desc:0 "击溃苏联。\n\n§Y第 3/3 阶段§!（时限 660 天）。完成后授予真我刻印本体——永久保留。"
