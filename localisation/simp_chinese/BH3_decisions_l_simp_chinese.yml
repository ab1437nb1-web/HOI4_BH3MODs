BH3_cultivate_ValkyrieSoldier_Tips_decision_TT:0 "当前营数量[?num_battalions]，可获得各等级女武神作战人员数量如下：\n每有一名B级女武神将领可获得作战人员数量：§C[?ValkyrieSoldier_B_num]§!\n每有一名A级女武神将领可获得作战人员数量：§C[?ValkyrieSoldier_A_num]§!\n每有一名S级女武神将领可获得作战人员数量：§C[?ValkyrieSoldier_S_num]§!\n每有一名SS级女武神将领可获得作战人员数量：§C[?ValkyrieSoldier_SS_num]§!\n每有一名SSS级女武神将领可获得作战人员数量：§C[?ValkyrieSoldier_SSS_num]§!"
