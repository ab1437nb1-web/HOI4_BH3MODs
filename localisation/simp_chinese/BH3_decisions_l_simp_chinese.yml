BH3_cultivate_decision_window_Character_Portraits_tt:0 "------------------------------------\n§Y点击这个头像按钮可切换头像§!"
BH3_cultivate_decision_window_KianaKaslana_tt:0 "[!BH3_cultivate_decision_window_KianaKaslana_click]"
BH3_cultivate_decision_window_KianaKaslana_ttName:0 "§Y$BH3_Character_KianaKaslana$§!"
BH3_cultivate_decision_window_KianaKaslana_ttDesc:0 "\n作为奥托用西琳基因与卡斯兰娜血脉制造的人造人（K-423），幼年被齐格飞收养并赋予姓名。12岁时因空之律者力量暴走导致齐格飞失踪，后被德丽莎收留进入圣芙蕾雅学园，成为一名女武神。\n\n\n\n\n£GFX_decision_cultivate_KianaKaslana\n\n\n\n\n\n"
BH3_cultivate_decision_window_KianaKaslana_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^0]§!"
BH3_cultivate_decision_window_KianaKaslana_ttDescAdd:0 "$BH3_cultivate_decision_window_KianaKaslana_ttDesc$-------------"

BH3_cultivate_decision_window_RaidenMei_tt:0 "[!BH3_cultivate_decision_window_RaidenMei_click]"
BH3_cultivate_decision_window_RaidenMei_ttName:0 "§Y$BH3_Character_RaidenMei$§!"
BH3_cultivate_decision_window_RaidenMei_ttDesc:0 "\nME社千金，因父亲雷电龙马被陷害入狱而遭孤立。体内被植入征服宝石成为第三律者素体，长空市崩坏中觉醒雷之律者力量，后被琪亚娜唤醒人性，转入圣芙蕾雅学园成为一名女武神。\n\n\n\n\n£GFX_decision_cultivate_RaidenMei\n\n\n\n\n\n"
BH3_cultivate_decision_window_RaidenMei_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^1]§!"
BH3_cultivate_decision_window_RaidenMei_ttDescAdd:0 "$BH3_cultivate_decision_window_RaidenMei_ttDesc$-------------"

BH3_cultivate_decision_window_BronyaZaych_tt:0 "[!BH3_cultivate_decision_window_BronyaZaych_click]"
BH3_cultivate_decision_window_BronyaZaych_ttName:0 "§Y$BH3_Character_BronyaZaych$§!"
BH3_cultivate_decision_window_BronyaZaych_ttDesc:0 "\n西伯利亚孤儿，被可可利亚收养培养为杀手"乌拉尔的银狼"。经历X-10实验获得重装小兔但双腿瘫痪，后为保护希儿加入逆熵。执行监视雷电芽衣任务时与琪亚娜相识，最终选择留在圣芙蕾雅学园。\n\n\n\n\n£GFX_decision_cultivate_BronyaZaych\n\n\n\n\n\n"
BH3_cultivate_decision_window_BronyaZaych_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^2]§!"
BH3_cultivate_decision_window_BronyaZaych_ttDescAdd:0 "$BH3_cultivate_decision_window_BronyaZaych_ttDesc$-------------"

BH3_cultivate_decision_window_SeeleVollerei_tt:0 "[!BH3_cultivate_decision_window_SeeleVollerei_click]"
BH3_cultivate_decision_window_SeeleVollerei_ttName:0 "§Y$BH3_Character_SeeleVollerei$§!"
BH3_cultivate_decision_window_SeeleVollerei_ttDesc:0 "\n天生圣痕觉醒者，因第二次崩坏失去父母，被可可利亚孤儿院收养。为保护布洛妮娅自愿参加X-10实验，身体量子化坠入量子之海，仅头饰遗落现实。\n\n\n\n\n£GFX_decision_cultivate_SeeleVollerei\n\n\n\n\n\n"
BH3_cultivate_decision_window_SeeleVollerei_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^3]§!"
BH3_cultivate_decision_window_SeeleVollerei_ttDescAdd:0 "$BH3_cultivate_decision_window_SeeleVollerei_ttDesc$-------------"

BH3_cultivate_decision_window_SeeleVollereiBlack_tt:0 "[!BH3_cultivate_decision_window_SeeleVollereiBlack_click]"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttName:0 "§Y$BH3_Character_SeeleVollereiBlack$§!"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttDesc:0 "\n在X-10实验中从希儿恐惧中诞生的第二人格，栖息于量子之海。性格强势冷酷，自称"另一个我"，能自由操控量子形态，暗中守护着表人格希儿。\n\n\n\n\n£GFX_decision_cultivate_SeeleVollerei\n\n\n\n\n\n"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^4]§!\n§C该角色需通过事件获取§!"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttDescAdd:0 "$BH3_cultivate_decision_window_SeeleVollereiBlack_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaApocalypse_tt:0 "[!BH3_cultivate_decision_window_TheresaApocalypse_click]"
BH3_cultivate_decision_window_TheresaApocalypse_ttName:0 "§Y$BH3_Character_TheresaApocalypse$§!"
BH3_cultivate_decision_window_TheresaApocalypse_ttDesc:0 "\n奥托以卡莲基因与崩坏兽"毗湿奴"融合制造的克隆体A-310，12岁后停止生长。1973年首战击败帝王级崩坏兽，后成为天命S级女武神。1999年挚友塞西莉亚战死后，于2009年建立圣芙蕾雅学园培养新一代女武神。\n\n\n\n\n£GFX_decision_cultivate_TheresaApocalypse\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaApocalypse_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^5]§!"
BH3_cultivate_decision_window_TheresaApocalypse_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaApocalypse_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaLunar_tt:0 "[!BH3_cultivate_decision_window_TheresaLunar_click]"
BH3_cultivate_decision_window_TheresaLunar_ttName:0 "§Y$BH3_Character_TheresaLunar$§!"
BH3_cultivate_decision_window_TheresaLunar_ttDesc:0 "\n奥托为复活卡莲制造的克隆体A-872，长期囚禁于实验室。逃出后被视作怪物，流浪时因吸血冲动遭人类追捕，直至遇见舰长获得救赎。\n\n\n\n\n£GFX_decision_cultivate_TheresaLunar\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaLunar_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^6]§!"
BH3_cultivate_decision_window_TheresaLunar_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaLunar_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaStarlitAstrologos_tt:0 "[!BH3_cultivate_decision_window_TheresaStarlitAstrologos_click]"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttName:0 "§Y$BH3_Character_TheresaStarlitAstrologos$§!"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDesc:0 "\n煌帝国皇太孙，12岁时因异兽祸乱失去先皇，在舰长（刺客先生）帮助下封印祸斗并获永生。后统一帝国，隐退研究时空穿越，误召阿琳双子导致世界轮回，最终由舰长修正历史。\n\n\n\n\n£GFX_decision_cultivate_TheresaStarlitAstrologos\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^7]§!"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDesc$-------------"

BH3_cultivate_decision_window_Fuka_tt:0 "[!BH3_cultivate_decision_window_Fuka_click]"
BH3_cultivate_decision_window_Fuka_ttName:0 "§Y$BH3_Character_Fuka$§!"
BH3_cultivate_decision_window_Fuka_ttDesc:0 "\n前文明纪元融合战士CM-014，终焉之战幸存者。现文明纪元化名赤鸢守护神州，曾助姬麟封印蚩尤，创立江湖门派"云墨丹心"。1476年被七徒背叛"死亡"，1496年与奥托交易成为天命女武神。\n\n\n\n\n£GFX_decision_cultivate_Fuka\n\n\n\n\n\n"
BH3_cultivate_decision_window_Fuka_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^8]§!"
BH3_cultivate_decision_window_Fuka_ttDescAdd:0 "$BH3_cultivate_decision_window_Fuka_ttDesc$-------------"

BH3_cultivate_decision_window_BiankaDurandalAtaegina_tt:0 "[!BH3_cultivate_decision_window_BiankaDurandalAtaegina_click]"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttName:0 "§Y$BH3_Character_BiankaDurandalAtaegina$§!"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDesc:0 "\n幼年空难后被天命收养，经残酷训练成为S级女武神。14岁觉醒圣痕"不灭之刃"，16岁获黑渊白花认可，现为天命最强战力，直属奥托执行机密任务。\n\n\n\n\n£GFX_decision_cultivate_BiankaDurandalAtaegina\n\n\n\n\n\n"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^9]§!"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDescAdd:0 "$BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDesc$-------------"

BH3_cultivate_decision_window_RitaRossweisse_tt:0 "[!BH3_cultivate_decision_window_RitaRossweisse_click]"
BH3_cultivate_decision_window_RitaRossweisse_ttName:0 "§Y$BH3_Character_RitaRossweisse$§!"
BH3_cultivate_decision_window_RitaRossweisse_ttDesc:0 "\n幼时被天命极东支部收养培养，16岁成为A级女武神。因出色表现被奥托选中，调任为幽兰黛尔副官，现为不灭之刃小队核心成员，专精情报与暗杀任务。\n\n\n\n\n£GFX_decision_cultivate_RitaRossweisse\n\n\n\n\n\n"
BH3_cultivate_decision_window_RitaRossweisse_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^10]§!"
BH3_cultivate_decision_window_RitaRossweisse_ttDescAdd:0 "$BH3_cultivate_decision_window_RitaRossweisse_ttDesc$-------------"

BH3_cultivate_decision_window_Eden_tt:0 "[!BH3_cultivate_decision_window_Eden_click]"
BH3_cultivate_decision_window_Eden_ttName:0 "§Y$BH3_Character_Eden$§!"
BH3_cultivate_decision_window_Eden_ttDesc:0 "\n前纪元最伟大的艺术家与战士，终焉之战中作为逐火英桀"黄金"参战。其艺术造诣与战斗才能同样出众，曾创作无数经典作品，在人类文明最后时刻仍坚持举办音乐会鼓舞士气。\n\n\n\n\n£GFX_decision_cultivate_Eden\n\n\n\n\n\n"
BH3_cultivate_decision_window_Eden_ttScore:0 "§R女武神战力值：[?ROOT.BH3_Country_Strongest_Valkyire_Array^11]§!"
BH3_cultivate_decision_window_Eden_ttDescAdd:0 "$BH3_cultivate_decision_window_Eden_ttDesc$-------------"

