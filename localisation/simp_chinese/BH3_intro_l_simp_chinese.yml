BH3_Intro_Window_Update_Container_Content_t:0 "§B2025年10月4日更新§!\n§R调整数据§!\n1、女武神（人员）造价提升，且可以租借；\n2、调整女武神内阁数值；\n3、上调战斗对陆上要塞伤害的概率；\n4、调整崩坏兽编制和数值；\n5、调整虚空万藏和千界一乘的第零额定功率的效果;\n6、上调女武神学说的陆军经验花费。\n§RBUG修复§!\n1、修复第一个女武神学说HP修正错误的问题；\n2、将崩坏部队模板修改为全英文，解决英文版显示错误；\n3、修复崩坏入侵模式下女武神支援不会给ai刷女武神部队的问题。\n§R新增功能§!\n1、崩坏入侵模式新增侵蚀之律者；\n2、新增爱莉希雅-粉色妖精小姐模型，可在第四代女武神装甲中选择该模型；\n3、旧女武神不在允许制造，研发完成自动创建对应女武神装备并适配模型；\n4、新增崩坏死士，具有极高的hp和组织度，同时调整了崩坏刷兵配比，使得死士占50%以上；\n5、新增2个内阁，同时增加对全体女武神生效的攻防modify。\n\n§B2025年10月4日更新§!\n调整数据\n1、调整女武神学说，使得女武神装甲底盘可享受；\n2、旧女武神兵种研发不在解锁营编制。\nBUG修复\n1、伊甸之星作用省份图标错误；\n2、为部分决议更换图标。\n新增功能\n1、新增女武神装甲底盘及大量零件，高级底盘和零件通过女武神研发和特殊工程获得；\n2、新增营编制“女武神”，该营编制使用女武神装甲底盘和女武神作战人员；\n3、新增3个特殊工程项目：改进崩坏能反应炉、女武神超重型装甲结构、武装人偶；\n4、女武神作战人员通过决议栏自动训练获取，A级以上需要玩家提高女武神将领等级获得，B级和A级作战人员可以通过扩建女武神学校。\n\n§B2025年6月1日更新§!\n调整数据\n1、调整崩坏入侵下获取的雷律权能效果；\n2、调整终焉一击debuff效果；\n3、加强终焉一击对建筑的伤害；\n4、调整崩坏随工业增强的buff，按全球人类国家所有工业进行计算，超1000工厂以上部分按0、05%计算；\n5、下调星之环特质加成；\n6、削弱所有等级女武神特质；\n7、削弱所有神之键装备的基础数值，下调神之键支援连所需装备数和对特种营加成，上调神之键支援连提高组织度，上调造价；\n8、大幅上调女武神装备造价；\nBUG修复\n1、非崩坏国家与崩坏同阵营、傀儡、宗主，会被崩坏强制吞并;\n2、调整获取天命女武神科技与获取舰长将领的按钮位置冲突;\n新增功能\n1、女武神将领不再按装甲区分，同一个人物的不同装甲只会获得一个人物，随人物女武神特质提升更改人物头像，晋升时触发升级事件;\n2、女武神战力系统，按将领等级、女武神特质、战斗输赢计算得分，按得分可获得区域最强女武神将和世界最强女武神特质;\n3、女武神战力系统将为所有玩家控制国家添加一个动态攻防增益;\n4、月球之战胜利达成条件对SSS级女武神数量、战力有一定要求;\n5、增加月球之战失败条件，崩坏侵蚀人口达到总人口60%直接触发失败结局;\n6、月球之战失败后，示现此世之兽每周对交战人类国家进行一次全地块轰炸;\n7、增设政治顾问，月下、伊甸、符华;\n歌曲\n增加Incarnation;\n\n§B2025年3月29日更新§!\n1、增加新的ui窗口，可设置值班角色；2、律者将领释放技能触发大招动画。\n\n§B2025年2年21日更新§!\n1、大幅上调迦尼萨和贝纳勒斯的组织度；\n2、大幅加强崩坏入侵模式下“崩坏加强buff”；\n3、为崩坏增加空军单位，且仅维持一定规模;4、锁定崩坏理之律者训练单位，科研槽调整为0；5、增加崩坏入侵3倍刷兵选项；6、选择律者单位加强，崩坏阵营律者将领允许使用专属将领技能。\n\n§B2025年2月4日更新§!\n1、为崩坏入侵模式增加崩坏阵营2位律者，死之律者和炎之律者；\n2、崩坏入侵模式下，律者诞生顺序将由国策确定，在AI控制下，每一局律者诞生顺序将完全不同。"
BH3_Intro_Window_HowPlay_Sub_btn1_t:0 "Mod启用"
BH3_Intro_Window_HowPlay_Container1_Content_t:0 "§B如何启动本Mod§!\n本mod通过决议的方式启用，点击决议§R休伯利安跃迁至该世界泡§!，除了§R崩坏3mod§!决议组外，还有§R女武神§!决议组和§R神之键§!决议组，内容详见专题介绍。\n\n§B如何启动崩坏入侵§!\n崩坏入侵模式通过决议启动，点击决议§R打开崩坏入侵模式界面（可设置爆发时间）§!，具体内容详见专题介绍。\n\n§BAI国家启用女武神将领、内阁、神之键等相关内容§!\n该决议启用后，AI控制的主要国家使用崩坏3mod的女武神将领和顾问内阁，同时为进行神之键的研发，为了增加挑战性在，在启用该决议一定时间后，为AI控制的主要国家生成大量女武神兵种。\n\n§B爱酱：舰长，女武神们已经准备就绪，请前往休伯利安指挥§!\n点击该决议将打开一个特殊的界面，包括§R女武神科技§!和§R作战学说§!的内容，具体内容详见§R女武神科技§!和§R作战学说§!专题。该界面也可通过右下角位置的休伯利安图标进行\n\n§B休伯利安移动和火力支援§!\n1、点击决议§R休伯利安跃迁至该世界泡§!后，本mod将在本国首都上空创建休伯利安模型，该休伯利安模型可以在§R省份界面§!点击按钮进行移动;\n2、在决议中完成§R休伯利安主炮充能§!后，可以在§R省份界面§!点击开火按钮，将对敌国该省份军力造成一定伤害。当然你也可以在右下角休伯利安图标处，点击开火按钮实现同样效果，但需要再空军研发设施中完成§R休伯利安火力升级§!;\n3、该同时休伯利安所在省份上，玩家会获得一个只针对本国生效的省份修正§R休伯利安火力支援§!\n4、休伯利安将为其所在省份提供一个独属于本国的战斗修正，可在省份界面查看。\n\n§B为圣芙蕾雅学院筹集建设资金，同时女武神学院增加到1级§!\n该决议主要允许玩家使用特殊军工机构§R圣芙蕾雅学院§!，该军工机构为律者单位提供生产花费减少和装备升级。\n\n"
BH3_Intro_Window_HowPlay_Sub_btn2_t:0 "女武神科技"
BH3_Intro_Window_HowPlay_Container2_Content_t:0 "§B女武神兵种研发§!\n进入§R女武神科技§!界面后，选择女武神小头像进入具体研发界面并选择你想要研发的女武神，完成研发时自动获取该女武神科技、将领、模板师，玩家可以根据需要自行编制女武神部队。\n\n§B女武神科技研发条件§!\n玩家初始只能研发§R领域装·白练§!、§R脉冲装·绯红§!和§R女武神·战车§!，研发更高等级女武神科技往往需要研发上一个等级的女武神科技，具体研发条件可将鼠标悬停在女武神装甲图标上查看。\n\n§B律者获取§!\n1、律者同样在女武神研发界面研发获得，但只有当§R崩坏能浓度大于1000HW（全球紧张度大于40%）§!时才可以研发；\n2、若在§R崩坏入侵§!模式下，则需要在§R崩坏入侵§!设置时在§R是否可使用律者§!勾选允许；\n3、在满足崩坏能浓度条件的情况下，若已获取律者科技，则每7天自动获取1个对应律者核心装备。当然也可以通过军工机构§R圣芙蕾雅学院§!的第一个特质§R极东魔窟§!大幅降低造价来大规模生产律者装备。\n\n§B女武神装甲§!\n1、当完成女武神科技研发后，会在生产界面免费提供一个女武神装甲模板和装甲底盘，玩家可自行设计女武神装甲，同时提供一个女武神兵种编制；\n2、女武神兵种需要装备§R女武神装甲§!和§R女武神§!，前者在生产界面生产，后者采用特殊方式获得；\n3、§R第一代女武神装甲§!对应B级女武神科技，§R第二代女武神装甲§!对应A级女武神科技，§R第三代女武神装甲§!对应S级女武神科技，§R第四代女武神装甲§!对应SS级女武神科技，§R次时代女武神装甲§!需要再实验设施中研发；\n4、女武神装甲设计器的神之键和武装人偶配件需要再实验设施中研发。\n\n§B设置国家领导人§!\n每个女武神图标下面有§RB、A、S、SS等级§!按钮，点击该按钮会将当前女武神设置为国家领导人。§R注意§!部分国策锁定国家领导名字，设置女武神作为国家领导人会导致国策无法正常使用。\n\n§B女武神装备升级§!\n1、通过军工机构§R天命-赫尔海姆实验室§!升级女武神装备；\n2、通过军工机构§R圣芙蕾雅学院§!升级律者装备，§R圣芙蕾雅学院§!需要再决议中点击§R为圣芙蕾雅学院筹集建设资金，同时女武神学院增加到1级。§!\n\n"
BH3_Intro_Window_HowPlay_Sub_btn3_t:0 "女武神将领"
BH3_Intro_Window_HowPlay_Container3_Content_t:0 "§B女武神将领获取§!\n1、在§R女武神§!决议组中点击§R获得所有女武神将领（不含律者）§!;\n2、若是只想获取单个女武神将领，需要在研发界面完成女武神科技研发。\n\n§B律者将领获取§!\n目前律者将领获取需要在§R女武神科技§!界面完成律者研发。\n\n§B女武神将领等级提升§!\n1、每个女武神将领自带§RB级女武神特质§!或§RA级女武神特质§!，需要通过指挥陆军战斗提升§R女武神等级特质§!；\n2、女武神将领指挥的陆军数量越多，获得经验速度越快；\n3、具体经验积累进度可将鼠标悬停在女武神将领头像上，会出现§RA级女武神战斗经验积累§!的特质；\n4、当女武神将领取得新的§R女武神等级特质§!后，会自动切换当前女武神将领头像。\n\n§B律者技能§!\n律者将领带有特殊技能，在陆军指挥界面花费cp点激活，激活后为所指挥的陆军部队提供攻击加成，同时播放技能动画类。\n\n§B女武神培养或训练§!\n1、女武神兵种需要装备§R女武神装甲§!和§R女武神§!，前者在生产界面生产，后者采用特殊方式获得；\n2、§R女武神§!装备在激活本mod后，通过§R女武神§!决议组下各项决议自动获取；\n3、点击决议§R扩建女武神学院§!能提高每次B级和A级女武神装备获取数量，其他等级女武神无法通过决议§R扩建女武神学院§!获取更多；\n4、高等级女武神装备需要让女武神将领获取对应§R女武神等级特质§!，当该女武神将领拥有§RSSS级女武神特质§!时，仍然会自动获取其A级女武神装备。\n\n§B女武神将领头像切换§!\n1、当女武神将领取得更高等级的§R女武神等级特质§!时会自动切换女武神将领头像；2、在§R女武神§!决议组点击女武神头像按钮可手动切换女武神将领头像，使用手动后女武神将领取得更高等级的§R女武神等级特质§!时不在自动切换女武神将领头像。\n\n"
BH3_Intro_Window_HowPlay_Sub_btn4_t:0 "作战学说"
BH3_Intro_Window_HowPlay_Container4_Content_t:0 "进入§R作战学说§!界面后，花费陆军经验解锁陆作战学说，部分学说仅对女武神单位生效，鼠标悬停在作战学说上会显示该学说提供的具体加成。"
BH3_Intro_Window_HowPlay_Sub_btn5_t:0 "神之键"
BH3_Intro_Window_HowPlay_Container5_Content_t:0 "§B神之键研发§!\n1、玩家需要在实验设施研发解锁神之键；\n2、大部分神之键在陆军设施中研发，§R千界一乘§!需要在空军设施中研发；\n3、完成神之键研发为所在国家添加对应的国家精神，同时获得100数量的神之键装备，该装备主要用于启动§R神之键§!决议组下各个神之键的§R第零额定功率§!；\n4、完成神之键的研发还会为女武神装甲提供一种特殊配件。\n\n§B神之键第零额定功率§!\n1、在§R神之键§!决议组下查看并激活神之键的§R第零额定功率§!；\n2、神之键的§R第零额定功率§!激活需要满足相关条件，请在决议中详细查看激活条件和激活效果。\n\n"
BH3_Intro_Window_HowPlay_Sub_btn6_t:0 "崩坏入侵"
BH3_Intro_Window_HowPlay_Container6_Content_t:0 "§B玩法介绍§!\n在§R崩坏入侵§!决议组下点击决议§R打开崩坏入侵模式界面（可设置爆发时间）§!来设置并启动崩坏，可设置爆发地点和时间等，崩坏在某一省份爆发，期间会不断诞生拥有特殊技能的律者，玩家需要将崩坏和律者均击败。\n\n§B崩坏增强§!\n崩坏会随着游戏时间、崩坏能浓度、全球工业的增加而不断增强。\n\n§B崩坏律者§!\n崩坏会以创建国家的方式诞生律者，目前有6个崩坏律者并拥有独特的机制，玩家需要将崩坏律者扼杀在摇篮中或者击败崩坏律者，击败崩坏律者的国家将会获得对应的律者权能。\n\n§B结束方式§!\n要么被崩坏打败，要么打败崩坏。当崩坏投降倾向满足一定条件时会进入下一阶段，并有相关超事件和决议作为提示。\n\n§B难度选择§!\n因为钢铁雄心4的随机为伪随机，存在选择随机爆发但爆发地点固定的情况，通过切换国家设置崩坏爆发可以做到不同地方爆发崩坏。其他指定爆发省份是基于原版地图，其他大型mod修改过地图，会导致爆发地方与选择地方不同的问题。\n\n"
BH3_Intro_Window_Other_Container_Content_t:0 "§B问题反馈§!\n可以在本mod的steam创意工坊留言。\n\n§B兼容性§!\n兼容大部分MOD，但TNO目前有未知原因闪退，兼容方法请查看本mod的steam创意工坊讨论贴。\n\n§B杂谈§!\n喜欢的本mod的请在创意工坊点个赞。同时欢迎大家订阅作者另一个mod： §R碧蓝航线舰娘模型：AzurLaneModel§!，支持原版铁人模式，同时也兼容碧蓝mod。"