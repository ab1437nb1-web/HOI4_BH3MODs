#国家精神
BHS_Benghuai_idea:0 "崩坏"
BHS_Benghuai_idea_desc:0 "§R崩坏，是一种异常的灾害，是宇宙周期性调整的律动，随着文明诞生而生，以毁灭文明为最终目标，永远与人类文明为敌。§!"
BHS_Benghuai_idea_Player:0 "崩坏(玩家)"
BHS_Benghuai_idea_Player_desc:0 "§R崩坏，是一种异常的灾害，是宇宙周期性调整的律动，随着文明诞生而生，以毁灭文明为最终目标，永远与人类文明为敌。§!"
BHS_aggressive3:0 "高活性"
BHS_aggressive3_desc:0 "wryyyyyy！"
BHS_aggressive2:0 "中活性"
BHS_aggressive2_desc:0 "崩坏兽想活动活动身子"
BHS_aggressive1:0 "低活性"
BHS_aggressive1_desc:0 "崩坏兽只想晒太阳"
BHS_aggressive0:0 "崩坏难度修正"
BHS_aggressive0_desc:0 "感受绝望吧！"
BH3_no_step_back:0 "为世界上所有的美好而战"
BH3_no_step_back_desc:0 "为世界上所有的美好而战"
BH3_disaster:0 "突如其来的大崩坏"
BH3_disaster_desc:0 "§R大崩坏的突然爆发，让所有人猝不及防§!"
BH3_predict_effect:0 "§R[?global.BHSLandingPoint.GetName]§!将爆发崩坏"
BH3_predict_effect_desc:0 "一场崩坏被准确预测在§R[?global.BHSLandingPoint.GetName]§!爆发，这引起该国民众的恐慌"
BHS_level1_idea:0 "阶段1"
BHS_level1_idea_desc:0 "若崩坏浓度保持在§R1000§!§CHW§!以上3月以上，则进入阶段2"
BHS_level2_idea:0 "阶段2"
BHS_level2_idea_desc:0 "若崩坏浓度保持在§R1000§!§CHW§!以上6月以上,则进入阶段3。"
BHS_level3_idea:0 "阶段3"
BHS_level3_idea_desc:0 "若崩坏浓度保持在§R1000§!§CHW§!以上6月以上,则进入阶段4。"
BHS_level4_idea:0 "阶段4"
BHS_level4_idea_desc:0 "若崩坏浓度保持在§R1000§!§CHW§!以上6月以上,则进入阶段5。"
BHS_level5_idea:0 "阶段5"
BHS_level5_idea_desc:0 "最终阶段，崩坏获得极大加强。"
BHS_herrscher_enhance_idea:0 "崩坏律者单位增强"
BHS_herrscher_enhance_idea_desc:0 "崩坏律者单位增强"
BHS_NuclearCorrosionResistance_effect:0 "核熔蚀抗性"
BHS_NuclearCorrosionResistance_effect_desc:0 "为了应对不断增强的崩坏，人类对崩坏动用了核武器,虽然消灭大量崩坏兽，但促使崩坏兽在基因层面急速进化，衍生出针对核爆能量与辐射的§R核熔蚀抗性§!，这是崩坏意志对文明武器的“针对性进化”，人类越依赖毁灭性武器，崩坏兽的适应越致命。"

BHS_HI1_Power:0 "理之律者权能"
BHS_HI1_Power_desc:0 "可令凡人遍观法理,解构万象再造神迹。"
BHS_HI1_Power_EffectHuman:0 "理之律者权能对人类影响"
BHS_HI1_Power_EffectHuman_desc:0 "§R理之律者运用权能每个月扣除所有人类国家一个科研槽§!"

BHS_HI2_Power:0 "空之律者权能"
BHS_HI2_Power_desc:0 "可令高天变作墙垣，祸津众神穿行维艰。"
BHS_HI2_Power_EffectHuman:0 "空之律者权能对人类影响"
BHS_HI2_Power_EffectHuman_desc:0 "§R空之律者运用权能每7天召唤陨石随机对交战的省份的建筑和军队造成伤害§!"

BHS_HI3_Power:0 "雷之律者权能"
BHS_HI3_Power_desc:0 "可令雷光撕裂长空，星流霆击施罚天刑。"
BHS_HI3_Power_EffectHuman:0 "雷之律者权能对人类影响"
BHS_HI3_Power_EffectHuman_desc:0 "§R无额外效果§!"

BHS_HI6_Power:0 "死之律者权能"
BHS_HI6_Power_desc:0 "可令荒冢遍开花丛，生生死死流转无踪。"
BHS_HI6_Power_EffectHuman:0 "死之律者权能对人类影响"
BHS_HI6_Power_EffectHuman_desc:0 "§R死之律者运用权能每50天对任一国家造成人员伤害，同时任意2个省份受到崩坏侵蚀§!"
BHS_HI7_Power:0 "炎之律者权能"
BHS_HI7_Power_desc:0 "可令炽火燃烧尘寰，赫赫炎炎烛天燎原。"
BHS_HI7_1_Power:0 "炎之律者权能全力一击"
BHS_HI7_1_Power_desc:0 "§R炎之律者运用权能每20天有25%概率获得7天攻击加强效果§!"

BHS_HH2_Power:0 "侵蚀之律者权能"
BHS_HH2_Power_desc:0 "§R1.侵蚀之律者每20天随机对一个玩家发动侵蚀权能，遮挡玩家操作界面（不影响操作，但会有视觉遮挡）；\n2.侵蚀律者诞生后，为崩坏和侵蚀律者创建情报机构。§!"

