BH3_Character_event.41.t:0 "Awakening"
BH3_Character_event.41.d:0 "Young Seele always felt followed by a 'shadow'. That voice whispered in nightmares and roared during crises. Until the Honkai experiment plunged her into the abyss, and the other her finally tore through the veil of pretense - born from Seele's fears and repression 'Cowardly you, only knows how to cry. But I, will tear apart all threats.'"
BH3_Character_event.41.a1:0 "Come forth, the other me!"
BH3_Character_event.41.a1d:0 "The other Seele becomes an Army General"
BH3_Character_event.41.a2:0 "I beg you, the other me!"
BH3_Character_event.41.a2d:0 "Obtain trait §R'Dual-Ego'§!"
