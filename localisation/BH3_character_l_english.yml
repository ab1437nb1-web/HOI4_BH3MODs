BH3_Character_event.1.t:0 "§R[?BH3_Character_event_1_target.GetName]§! fell in the Moon Battle"
BH3_Character_event.1.d:0 "The Herrscher of the End's attack pierced through her body. Her armor was already shattered, blood seeping from every crack and freezing into dark red crystals on the lunar dust. Her vision had blurred, but she could still see Earth hanging silently in the distance - azure yet fragile."
BH3_Character_event.1.a:0 "......."
