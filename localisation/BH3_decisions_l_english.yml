BH3_cultivate_decision_window_Character_Portraits_tt:0 "------------------------------------\n§YClick this portrait button to switch avatars§!"
BH3_cultivate_decision_window_KianaKaslana_tt:0 "[!BH3_cultivate_decision_window_KianaKaslana_click]"
BH3_cultivate_decision_window_KianaKaslana_ttName:0 "§Y$BH3_Character_KianaKaslana$§!"
BH3_cultivate_decision_window_KianaKaslana_ttDesc:0 "\nAn artificial human (K-423) created by Otto using Sirin's genes and Kaslana bloodline. Adopted by Siegfried in childhood but caused his disappearance at age 12 due to Void Herrscher's rampage. Later taken in by Theresa to attend St. Freya Academy as a Valkyrie.\n\n\n\n\n£GFX_decision_cultivate_KianaKaslana\n\n\n\n\n\n"
BH3_cultivate_decision_window_KianaKaslana_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^0]§!"
BH3_cultivate_decision_window_KianaKaslana_ttDescAdd:0 "$BH3_cultivate_decision_window_KianaKaslana_ttDesc$-------------"

BH3_cultivate_decision_window_RaidenMei_tt:0 "[!BH3_cultivate_decision_window_RaidenMei_click]"
BH3_cultivate_decision_window_RaidenMei_ttName:0 "§Y$BH3_Character_RaidenMei$§!"
BH3_cultivate_decision_window_RaidenMei_ttDesc:0 "\nHeiress of ME Corp, ostracized after her father Ryoma's wrongful imprisonment. Implanted with the Conquest Gem to become the 3rd Herrscher candidate. Awakened as Herrscher of Thunder during Nagazora incident before Kiana restored her humanity, transferring to St. Freya Academy.\n\n\n\n\n£GFX_decision_cultivate_RaidenMei\n\n\n\n\n\n"
BH3_cultivate_decision_window_RaidenMei_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^1]§!"
BH3_cultivate_decision_window_RaidenMei_ttDescAdd:0 "$BH3_cultivate_decision_window_RaidenMei_ttDesc$-------------"

BH3_cultivate_decision_window_BronyaZaych_tt:0 "[!BH3_cultivate_decision_window_BronyaZaych_click]"
BH3_cultivate_decision_window_BronyaZaych_ttName:0 "§Y$BH3_Character_BronyaZaych$§!"
BH3_cultivate_decision_window_BronyaZaych_ttDesc:0 "\nSiberian orphan trained as assassin 'Ural Silver Wolf' by Cocolia. Gained Project Bunny through X-10 experiment but lost leg mobility. Joined Anti-Entropy to protect Seele, initially assigned to monitor Mei before befriending Kiana at St. Freya.\n\n\n\n\n£GFX_decision_cultivate_BronyaZaych\n\n\n\n\n\n"
BH3_cultivate_decision_window_BronyaZaych_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^2]§!"
BH3_cultivate_decision_window_BronyaZaych_ttDescAdd:0 "$BH3_cultivate_decision_window_BronyaZaych_ttDesc$-------------"

BH3_cultivate_decision_window_SeeleVollerei_tt:0 "[!BH3_cultivate_decision_window_SeeleVollerei_click]"
BH3_cultivate_decision_window_SeeleVollerei_ttName:0 "§Y$BH3_Character_SeeleVollerei$§!"
BH3_cultivate_decision_window_SeeleVollerei_ttDesc:0 "\nNatural Stigma bearer orphaned in 2nd Honkai War, adopted by Cocolia's orphanage. Volunteered for X-10 experiment to protect Bronya, resulting in quantum-state transformation where only her hairpin remained in reality.\n\n\n\n\n£GFX_decision_cultivate_SeeleVollerei\n\n\n\n\n\n"
BH3_cultivate_decision_window_SeeleVollerei_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^3]§!"
BH3_cultivate_decision_window_SeeleVollerei_ttDescAdd:0 "$BH3_cultivate_decision_window_SeeleVollerei_ttDesc$-------------"

BH3_cultivate_decision_window_SeeleVollereiBlack_tt:0 "[!BH3_cultivate_decision_window_SeeleVollereiBlack_click]"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttName:0 "§Y$BH3_Character_SeeleVollereiBlack$§!"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttDesc:0 "\nThe alternate personality born from Seele's fears during X-10 experiment, residing in the Quantum Sea. Cold and dominant, calling herself 'the other me', freely manipulating quantum forms while secretly protecting the original Seele.\n\n\n\n\n£GFX_decision_cultivate_SeeleVollerei\n\n\n\n\n\n"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^4]§!\n§CThis character requires event acquisition§!"
BH3_cultivate_decision_window_SeeleVollereiBlack_ttDescAdd:0 "$BH3_cultivate_decision_window_SeeleVollereiBlack_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaApocalypse_tt:0 "[!BH3_cultivate_decision_window_TheresaApocalypse_click]"
BH3_cultivate_decision_window_TheresaApocalypse_ttName:0 "§Y$BH3_Character_TheresaApocalypse$§!"
BH3_cultivate_decision_window_TheresaApocalypse_ttDesc:0 "\nClone A-310 created by Otto fusing Kallen's genes with Vishnu Honkai beast DNA, ceasing growth at age 12. Defeated an Emperor-class Honkai in 1973 debut, becoming Schicksal's S-rank Valkyrie. Founded St. Freya Academy in 2009 after Cecilia's death.\n\n\n\n\n£GFX_decision_cultivate_TheresaApocalypse\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaApocalypse_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^5]§!"
BH3_cultivate_decision_window_TheresaApocalypse_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaApocalypse_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaLunar_tt:0 "[!BH3_cultivate_decision_window_TheresaLunar_click]"
BH3_cultivate_decision_window_TheresaLunar_ttName:0 "§Y$BH3_Character_TheresaLunar$§!"
BH3_cultivate_decision_window_TheresaLunar_ttDesc:0 "\nClone A-872 created for Kallen's resurrection, imprisoned in labs until escape. Branded a monster for bloodthirsty urges during exile until rescued by the Captain.\n\n\n\n\n£GFX_decision_cultivate_TheresaLunar\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaLunar_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^6]§!"
BH3_cultivate_decision_window_TheresaLunar_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaLunar_ttDesc$-------------"

BH3_cultivate_decision_window_TheresaStarlitAstrologos_tt:0 "[!BH3_cultivate_decision_window_TheresaStarlitAstrologos_click]"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttName:0 "§Y$BH3_Character_TheresaStarlitAstrologos$§!"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDesc:0 "\nImperial heir who lost her grandfather to calamity at 12. With the Captain's help, sealed the disaster and gained immortality. After unifying the empire, her time travel research accidentally summoned the twins, causing temporal loops until the Captain fixed history.\n\n\n\n\n£GFX_decision_cultivate_TheresaStarlitAstrologos\n\n\n\n\n\n"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^7]§!"
BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDescAdd:0 "$BH3_cultivate_decision_window_TheresaStarlitAstrologos_ttDesc$-------------"

BH3_cultivate_decision_window_Fuka_tt:0 "[!BH3_cultivate_decision_window_Fuka_click]"
BH3_cultivate_decision_window_Fuka_ttName:0 "§Y$BH3_Character_Fuka$§!"
BH3_cultivate_decision_window_Fuka_ttDesc:0 "\nPrevious Era MANTIS soldier CM-014 who survived the Final War. In current era as guardian 'Chi Xiao', helped seal Chiyou and founded 'Cloud Knight' sect. 'Died' in 1476 from disciples' betrayal before joining Schicksal in 1496 via deal with Otto.\n\n\n\n\n£GFX_decision_cultivate_Fuka\n\n\n\n\n\n"
BH3_cultivate_decision_window_Fuka_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^8]§!"
BH3_cultivate_decision_window_Fuka_ttDescAdd:0 "$BH3_cultivate_decision_window_Fuka_ttDesc$-------------"

BH3_cultivate_decision_window_BiankaDurandalAtaegina_tt:0 "[!BH3_cultivate_decision_window_BiankaDurandalAtaegina_click]"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttName:0 "§Y$BH3_Character_BiankaDurandalAtaegina$§!"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDesc:0 "\nOrphaned in air crash and raised by Schicksal through brutal training. Awakened 'Immortal Blades' Stigma at 14, deemed worthy of Abyss Flower at 16. Now Schicksal's strongest warrior executing Otto's black ops.\n\n\n\n\n£GFX_decision_cultivate_BiankaDurandalAtaegina\n\n\n\n\n\n"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^9]§!"
BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDescAdd:0 "$BH3_cultivate_decision_window_BiankaDurandalAtaegina_ttDesc$-------------"

BH3_cultivate_decision_window_RitaRossweisse_tt:0 "[!BH3_cultivate_decision_window_RitaRossweisse_click]"
BH3_cultivate_decision_window_RitaRossweisse_ttName:0 "§Y$BH3_Character_RitaRossweisse$§!"
BH3_cultivate_decision_window_RitaRossweisse_ttDesc:0 "\nRaised by Schicksal's Far East Branch, became A-rank Valkyrie at 16. Chosen by Otto as Durandal's adjutant for exceptional skills, now core member of Immortal Blades specializing in intelligence and assassination.\n\n\n\n\n£GFX_decision_cultivate_RitaRossweisse\n\n\n\n\n\n"
BH3_cultivate_decision_window_RitaRossweisse_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^10]§!"
BH3_cultivate_decision_window_RitaRossweisse_ttDescAdd:0 "$BH3_cultivate_decision_window_RitaRossweisse_ttDesc$-------------"

BH3_cultivate_decision_window_Eden_tt:0 "[!BH3_cultivate_decision_window_Eden_click]"
BH3_cultivate_decision_window_Eden_ttName:0 "§Y$BH3_Character_Eden$§!"
BH3_cultivate_decision_window_Eden_ttDesc:0 "\nPrevious Era's greatest artist-warrior who fought as Flame-Chaser 'Gold' during Final War. Created timeless masterpieces while maintaining combat prowess, holding concerts to boost morale until civilization's end.\n\n\n\n\n£GFX_decision_cultivate_Eden\n\n\n\n\n\n"
BH3_cultivate_decision_window_Eden_ttScore:0 "§RValkyrie Combat Power  [?ROOT.BH3_Country_Strongest_Valkyire_Array^11]§!"
BH3_cultivate_decision_window_Eden_ttDescAdd:0 "$BH3_cultivate_decision_window_Eden_ttDesc$-------------"

