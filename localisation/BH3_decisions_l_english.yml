BH3_BHS_Invasion_decisions_group_desc:0 "Global population:§R[?global.HonkaiImpact_Population_Total]§! million. Honkai has claimed §R[?global.HonkaiImpact_Cause_Population_Casualty]§! million lives (§R[?global.HonkaiImpact_Cause_Population_Casualty_p]%§! of total population).\n\nCurrent global Valkyrie Rank SSS count:§R[?global.BH3_World_SSS_Valkyire_num]§!\nTotal global Valkyrie combat power:§R[?global.BH3_World_Valkyire_Score]K§!\n(Use Valkyrie commanders to lead battles to gain combat power.)\nWorld's strongest Valkyrie:[?global.BH3_World_Strongest_Valkyire_Country.GetFlag][?global.BH3_World_Strongest_Valkyire_Country.GetName]§Y[?global.BH3_World_Strongest_Valkyire.GetName]§! (Combat power:§Y[?global.BH3_World_Strongest_Valkyire_Score]§!)\n\nOur nation's strongest Valkyrie:§Y[?ROOT.BH3_Country_Strongest_Valkyire.GetName]§! (Combat power:§Y[?ROOT.BH3_Country_Strongest_Valkyire_Score]§!)\nKiana Kaslana:[?ROOT.BH3_Country_Strongest_Valkyire_Array^0]\nRaiden Mei:[?ROOT.BH3_Country_Strongest_Valkyire_Array^1]\nBronya Zaychik:[?ROOT.BH3_Country_Strongest_Valkyire_Array^2]\nSeele Vollerei:[?ROOT.BH3_Country_Strongest_Valkyire_Array^3]\nSeele Vollerei (Dark):[?ROOT.BH3_Country_Strongest_Valkyire_Array^4]\nTheresa Apocalypse:[?ROOT.BH3_Country_Strongest_Valkyire_Array^5]\nTheresa Luna Kindred:[?ROOT.BH3_Country_Strongest_Valkyire_Array^6]\nTheresa Starlit Astrologos:[?ROOT.BH3_Country_Strongest_Valkyire_Array^7]\nFu Hua:[?ROOT.BH3_Country_Strongest_Valkyire_Array^8]\nBianka Ataegina Durandal:[?ROOT.BH3_Country_Strongest_Valkyire_Array^9]\nRita Rossweisse:[?ROOT.BH3_Country_Strongest_Valkyire_Array^10]\nEden:[?ROOT.BH3_Country_Strongest_Valkyire_Array^11]"
