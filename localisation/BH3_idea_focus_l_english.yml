BHS_NuclearCorrosionResistance_effect:0 "Nuclear Corrosion Resistance"
BHS_NuclearCorrosionResistance_effect_desc:0 "To combat the escalating Honkai threat, humanity resorted to nuclear weapons. While this eradicated vast numbers of Honkai Beasts, it triggered rapid genetic evolution within them, leading to the emergence of §RNuclear Corrosion Resistance§!—an adaptation specifically countering nuclear blast energy and radiation. This reflects the Will of Honkai's targeted evolution against civilization's weapons, the more humanity relies on annihilation, the deadlier the Honkai Beasts mutations become."

BHS_HI1_Power:0 "Authority of the Herrscher of Reason"
BHS_HI1_Power_desc:0 "Allows mortals to perceive the laws of the universe, deconstruct all things, and recreate miracles."
BHS_HI1_Power_EffectHuman:0 "Effect of the Herrscher of Reason's Authority on Humanity"
BHS_HI1_Power_EffectHuman_desc:0 "§RThe Herrscher of Reason uses her authority to deduct one research slot from all human nations every month.§!"

BHS_HI2_Power:0 "Authority of the Herrscher of Void"
BHS_HI2_Power_desc:0 "Turns the heavens into walls, making it difficult for calamitous gods to traverse dimensions."
BHS_HI2_Power_EffectHuman:0 "Effect of the Herrscher of Void's Authority on Humanity"
BHS_HI2_Power_EffectHuman_desc:0 "§RThe Herrscher of Void uses her authority to summon meteorites every 7 days, randomly damaging buildings and military forces in warring provinces.§!"

BHS_HI3_Power:0 "Authority of the Herrscher of Thunder"
BHS_HI3_Power_desc:0 "Allows lightning to tear through the sky, delivering divine punishment with starfall and thunder."
BHS_HI3_Power_EffectHuman:0 "Effect of the Herrscher of Thunder's Authority on Humanity"
BHS_HI3_Power_EffectHuman_desc:0 "§RNo additional effects.§!"

BHS_HI6_Power:0 "Authority of the Herrscher of Rebirth"
BHS_HI6_Power_desc:0 "Causes flowers to bloom amidst desolate graves, as life and death flow endlessly."
BHS_HI6_Power_EffectHuman:0 "Effect of the Herrscher of Reason's Authority on Humanity"
BHS_HI6_Power_EffectHuman_desc:0 "§RThe Herrscher of Rebirth uses her authority to cause population damage to a random nation every 50 days, while two random provinces suffer Honkai erosion.§!"
BHS_HI7_Power:0 "Authority of the Herrscher of Flamescion"
BHS_HI7_Power_desc:0 "Allows scorching flames to engulf the mortal world, blazing brightly and illuminating the heavens."
BHS_HI7_1_Power:0 "Judgment of Shamash"
BHS_HI7_1_Power_desc:0 "§RThe Herrscher of Flamescion uses her authority to gain a 7-day attack boost with a 25% chance every 20 days.§!"

